[package]
name = "editor-node-views-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Node views on rinch-web: the same counter, table and badge views as examples/editor-node-views, in the browser"

[dependencies]
rinch = { path = "../../crates/rinch", default-features = false, features = ["components", "theme"] }
rinch-core = { path = "../../crates/rinch-core", features = ["theme"] }
rinch-web = { path = "../../crates/rinch-web" }
rinch-editor-core = { path = "../../crates/rinch-editor-core" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
