[package]
name = "video-call"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A desktop video call on rinch-rtc's audio and video tracks, signalled through rtc-room-relay"

[dependencies]
rinch = { workspace = true, features = ["desktop", "components", "theme", "debug"] }
rinch-core = { workspace = true }
rinch-rtc = { workspace = true, features = ["media", "serde"] }
rinch-ws = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# src/tests.rs starts a relay of its own on an ephemeral port.
rtc-room-relay = { path = "../rtc-room-relay" }
