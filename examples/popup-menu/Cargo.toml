[package]
name = "popup-menu"
version.workspace = true
edition.workspace = true
publish = false

[features]
# `cargo run -p popup-menu --features debug`: the rinch debug server.
debug = ["rinch/debug"]
# `--features gpu`: the GPU renderer (Vello), for `RINCH_RENDERER=gpu`.
gpu = ["rinch/gpu"]

[dependencies]
rinch = { workspace = true, features = ["desktop"] }
