[package]
name = "webgpu-surface-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "WebGPU RenderSurface demo for rinch-web — a GPU render callback draws into a <canvas> inside a rinch DOM UI (issues #91, #1768)"

[dependencies]
# Rinch without desktop + the browser-native DOM backend. `web-gpu` (#1768):
# rinch requests the page's WebGPU device and runs `set_gpu_render_callback`
# with the canvas's current texture; the app uses `rinch::wgpu` (wgpu 30).
rinch = { path = "../../crates/rinch", default-features = false, features = ["components", "theme", "web-gpu"] }
rinch-core = { path = "../../crates/rinch-core", features = ["theme"] }
rinch-web = { path = "../../crates/rinch-web" }

wasm-bindgen = "0.2"

# WASM utilities
console_error_panic_hook = "0.1"
console_log = "0.2"
log = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
