[package]
name = "islands-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Islands demo for rinch-web: multiple independent reactive roots hydrated into placeholder elements"

[dependencies]
# Rinch without desktop + the browser-native DOM backend
rinch = { path = "../../crates/rinch", default-features = false, features = ["components", "theme"] }
rinch-core = { path = "../../crates/rinch-core", features = ["theme"] }
rinch-web = { path = "../../crates/rinch-web" }

# WASM bindings + panic hook
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
