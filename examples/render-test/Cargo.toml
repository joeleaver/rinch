[package]
name = "render-test"
version.workspace = true
edition.workspace = true
description = "Headless renderer test fixture - renders components to PNG"

[[bin]]
name = "render-test"
path = "src/main.rs"

[dependencies]
rinch = { workspace = true, features = ["desktop", "components", "theme"] }
rinch-core = { workspace = true }
rinch-dom = { workspace = true, features = ["software-renderer"] }
png = "0.17"
wgpu = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }

[features]
default = ["gpu"]
gpu = ["rinch/gpu", "dep:wgpu", "dep:pollster"]
