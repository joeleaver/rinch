[package]
name = "tray-only"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rinch = { workspace = true, features = ["desktop", "components", "theme", "system-tray"] }

[features]
# The "Test notification" tray item (`rinch::notification`, #1522).
default = ["notifications"]
notifications = ["rinch/notifications"]

