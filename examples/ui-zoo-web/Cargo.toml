[package]
name = "ui-zoo-web"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "UI Zoo WASM build for GitHub Pages deployment"

[dependencies]
# Shared app logic from ui-zoo (no desktop features)
ui-zoo = { path = "../ui-zoo" }

# Rinch without desktop
rinch = { path = "../../crates/rinch", default-features = false, features = ["components", "theme"] }
rinch-core = { path = "../../crates/rinch-core", features = ["theme"] }

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
    "HtmlTextAreaElement", "HtmlHeadElement",
    "Node", "NodeList", "Text", "Comment",
    "CssStyleDeclaration", "DomRect", "DomRectList",
    "Event", "MouseEvent", "KeyboardEvent", "InputEvent",
    "EventTarget",
    "Range", "Selection", "CharacterData",
    "console",
] }

# WASM utilities
console_error_panic_hook = "0.1"
console_log = "0.2"
log = "0.4"

# NOTE: This crate uses browser-native DOM rendering.
# No rinch-dom, Taffy, Parley, Vello, winit, or Canvas 2D needed.
# The browser handles layout, text rendering, CSS, and painting natively.

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
