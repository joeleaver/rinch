<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Zoo - Rinch Widget Showcase</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1b1e;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Loading indicator shown until WASM + WebGPU init completes */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #c1c2c5;
            background: #1a1b1e;
            z-index: 10;
        }
        #loading h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        #loading p {
            font-size: 14px;
            color: #909296;
        }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="z" />
</head>
<body>
    <div id="loading">
        <h1>UI Zoo</h1>
        <p>Loading WebGPU...</p>
    </div>
    <canvas id="rinch-canvas"></canvas>
    <script>
        // Hide loading indicator once the canvas starts rendering
        const observer = new MutationObserver(() => {
            const canvas = document.getElementById('rinch-canvas');
            if (canvas && canvas.width > 0) {
                document.getElementById('loading').style.display = 'none';
                observer.disconnect();
            }
        });
        observer.observe(document.getElementById('rinch-canvas'), {
            attributes: true, attributeFilter: ['width', 'height']
        });
        // Fallback: hide after 5 seconds regardless
        setTimeout(() => {
            const el = document.getElementById('loading');
            if (el) el.style.display = 'none';
        }, 5000);
    </script>
</body>
</html>
