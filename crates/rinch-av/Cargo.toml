[package]
name = "rinch-av"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform audio/video device access for rinch"

[dependencies]
# Always available
rinch-core = { workspace = true }
tracing = { workspace = true }
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Audio (desktop)
cpal = { version = "0.18", optional = true }
# Camera (desktop)
nokhwa = { version = "0.10", features = ["input-native"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Navigator",
    "MediaDevices",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaTrackConstraints",
    "MediaTrackConstraintSet",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "CanvasRenderingContext2d",
    "ImageData",
    "Document",
    "Element",
    "Window",
    "AudioContext",
    "AudioContextOptions",
    "AudioNode",
    "AudioDestinationNode",
    "MediaStreamAudioSourceNode",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "AudioBuffer",
    "GainNode",
    "GainOptions",
] }

[features]
default = []
audio = ["dep:cpal"]
camera = ["dep:nokhwa"]

# Browser tests, synthetic sources only (an OscillatorNode, a canvas
# stream): no camera, no microphone, no permission prompt. Run with
#     CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner \
#     cargo test -p rinch-av --features audio,camera --target wasm32-unknown-unknown
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = [
    "OscillatorNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "MediaStreamAudioDestinationNode",
    "MediaStreamTrackState",
    "AudioContextState",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Window",
    "Document",
    "NodeList",
    "Node",
    "HtmlMediaElement",
] }
