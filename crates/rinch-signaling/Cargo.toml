[package]
name = "rinch-signaling"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebRTC signaling channel trait and WebSocket client for rinch"

[dependencies]
rinch-webrtc = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
] }
