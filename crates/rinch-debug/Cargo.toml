[package]
name = "rinch-debug"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Debug IPC server for rinch applications"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }

# The socket transport: the peer's credentials (`SO_PEERCRED`), the
# effective uid, and the signal-0 probe of a legacy app's pid.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["net", "process"] }

# `getpeereid`, where there is no `SO_PEERCRED` (Apple platforms, the BSDs).
[target.'cfg(all(unix, not(any(target_os = "linux", target_os = "android"))))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["socket", "user"] }

[dev-dependencies]
tempfile = "3"
