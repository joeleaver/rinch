[package]
name = "rinch-editor-view"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Renderer-agnostic rich-text editor view for Rinch: projects the pure rinch-editor-core model onto any rinch-core DomDocument (desktop rinch-dom or browser web_sys), with the imperative EditorHandle, the Editor component, the mounted-editor registry, and the caret-blink clock. Shared by the desktop (rinch) and web (rinch-web) editors. wasm-clean; collaboration is opt-in."

[dependencies]
rinch-core = { workspace = true }
rinch-editor-core = { workspace = true }
# The clock that stamps each local transaction for the history's typing-merge
# window (#940). `web_time` is `std::time` on native and `performance.now()` in a
# browser, where `std::time::Instant::now` panics.
web-time = "1"
# The Step↔CRDT collaboration adapter (yrs) — opt-in, so default (desktop AND web)
# builds link zero CRDT code. Enabled by the desktop `rinch`/`rinch-web` facades
# only when their own `collaboration` feature is on.
rinch-editor-collab = { workspace = true, optional = true }

[features]
# Collaborative editing (M9): wires the rinch-editor-collab adapter into EditorHandle.
collaboration = ["dep:rinch-editor-collab"]

[dev-dependencies]
# The MockDomDocument the view/handle tests project onto (proof the seam is
# renderer-agnostic — no rinch-dom/Parley needed).
rinch-core = { workspace = true, features = ["test-util"] }
# Raw yrs, to forge the foreign CRDT bytes the poisoned-session tests feed
# `collab_receive` (#196). Bytes-only coupling: the tests hand `Vec<u8>` across, so
# this only needs to speak the same lib0 v1 wire encoding as rinch-editor-collab's
# pin — no types are shared.
yrs = "0.27"
# The collab adapter's test-only client-id seam (`rinch_editor_collab::testing`), so a
# multi-peer fuzz builds its sessions with pinned yrs client ids and a seed replays
# (`EditorHandle::start_collaboration_host_with`). A dev-dependency only: no build of
# the view that an app links resolves it, and the lib's own collab dependency stays
# behind the `collaboration` feature.
rinch-editor-collab = { workspace = true, features = ["test-util"] }
