[package]
name = "rinch-rtc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform WebRTC data channels for rinch, with rinch-ws's callback shape (web RTCPeerConnection / native webrtc-rs)"

# Design record: docs/design/webrtc-data-channels.md (issue #1896).
#
# No `native`/`web` cargo features: the backend is picked by target, as in
# rinch-ws. tokio and webrtc-rs reach only an app that depends on this crate
# AND builds for a desktop target, which is an app that asked for native
# data channels; nothing else in the workspace depends on rinch-rtc.

[dependencies]
rinch-core = { workspace = true }
tracing = { workspace = true }
# `Description` / `IceCandidate` derive Serialize/Deserialize, so an app can
# put them on its own signalling channel without a mirror type.
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
# Audio and video tracks (docs/design/rtc-media.md, M1). Off by default: a
# data-channel-only app pays nothing. On the web it adds only bindings; on
# desktop it adds the codecs (VP8 on the system libvpx, H.264, Opus),
# rinch-av's capture and playback, and the decode/encode threads. VP8 needs
# libvpx's headers (`libvpx-dev`) and libclang at build time.
#
# H.264 comes one of two ways (M3); pick exactly one:
#   * `media`: openh264 built from Cisco's C source (a C compiler; nasm
#     optional). H.264 patent licensing is then the app's own concern.
#   * `media-cisco-openh264`: no H.264 code built in; the app downloads
#     Cisco's prebuilt OpenH264 binary separately and hands its path to
#     `media::load_openh264` at run time. Cisco's binary licence covers the
#     MPEG LA royalties when its conditions are met. See the user guide.
media = ["media-core", "openh264?/source"]
media-cisco-openh264 = ["media-core", "openh264?/libloading", "dep:sha2"]
# What both share (the cfg gate in the code). Not for direct use.
media-core = [
    "dep:openh264",
    "dep:opus",
    "dep:vpx-sys",
    "dep:rinch-av",
    "web-sys/AudioBuffer",
    "web-sys/AudioContext",
    "web-sys/AudioContextOptions",
    "web-sys/AudioContextState",
    "web-sys/EventTarget",
    "web-sys/AudioNode",
    "web-sys/AudioProcessingEvent",
    "web-sys/AudioWorklet",
    "web-sys/AudioWorkletNode",
    "web-sys/AudioWorkletNodeOptions",
    "web-sys/BaseAudioContext",
    "web-sys/Blob",
    "web-sys/BlobPropertyBag",
    "web-sys/CanvasRenderingContext2d",
    "web-sys/Document",
    "web-sys/Element",
    "web-sys/HtmlAudioElement",
    "web-sys/HtmlCanvasElement",
    "web-sys/HtmlElement",
    "web-sys/HtmlMediaElement",
    "web-sys/HtmlVideoElement",
    "web-sys/ImageData",
    "web-sys/MediaDeviceInfo",
    "web-sys/MediaDeviceKind",
    "web-sys/MediaDevices",
    "web-sys/MediaStream",
    "web-sys/MediaStreamAudioDestinationNode",
    "web-sys/MediaStreamConstraints",
    "web-sys/MediaStreamTrack",
    "web-sys/MediaTrackConstraints",
    "web-sys/MessagePort",
    "web-sys/Navigator",
    "web-sys/Node",
    "web-sys/NodeList",
    "web-sys/RtcRtpParameters",
    "web-sys/RtcRtpReceiver",
    "web-sys/RtcRtpSender",
    "web-sys/RtcRtpTransceiver",
    "web-sys/RtcRtpTransceiverDirection",
    "web-sys/RtcRtpTransceiverInit",
    "web-sys/RtcTrackEvent",
    "web-sys/ScriptProcessorNode",
    "web-sys/Url",
    "web-sys/Window",
    "web-sys/Worklet",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# webrtc-rs 0.21: an async driver over its sans-IO `rtc` core, with STUN and
# TURN (UDP) gathering. Pinned exactly: pre-1.0, a minor bump may break, and
# only `native.rs` names it. `crypto-ring`: no aws-lc C build, and the
# provider is chosen per connection (no process-global rustls install).
webrtc = { version = "=0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
# The one worker thread's current-thread runtime. tokio is already in every
# `gpu`, `notifications` and `global-hotkeys` build.
# webrtc-rs's sans-IO core, already in the graph through `webrtc`: named
# only for `SctpMaxMessageSize`, which `webrtc` does not re-export.
rtc = { version = "=0.21.1", default-features = false }
tokio = { version = "1.52", default-features = false, features = ["rt", "sync", "time", "net", "macros"] }
bytes = "1"
async-trait = "0.1"
# `atexit`, to close open peers on a normal process exit. Already in the tree.
libc = "0.2"
# The `media` feature's codecs and devices (desktop only).
openh264 = { version = "=0.9.9", default-features = false, optional = true }
opus = { version = "0.4", optional = true }
# VP8 (M2, decided 2026-10-27): the system's libvpx, found by pkg-config,
# bindings generated at build time (bindgen: libclang). libvpx-dev 1.14 on
# Ubuntu 24.04 is newer than the crate's pre-generated bindings.
vpx-sys = { package = "env-libvpx-sys", version = "=5.1.3", features = ["generate"], optional = true }
# Hashing Cisco's OpenH264 binary before it is loaded (media-cisco-openh264).
sha2 = { version = "0.10", optional = true }
rinch-av = { workspace = true, features = ["audio", "camera"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Event",
    "EventTarget",
    "MessageEvent",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcDataChannelInit",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcIceGatheringState",
    "RtcIceServer",
    "RtcIceTransportPolicy",
    "RtcOfferOptions",
    "RtcPeerConnection",
    "RtcPeerConnectionIceErrorEvent",
    "RtcPeerConnectionIceEvent",
    "RtcPeerConnectionState",
    "RtcSdpType",
    "RtcSignalingState",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
] }

[dev-dependencies]
rinch-core = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The interop target: a str0m ICE-lite peer shaped like Playweft's hosted
# server, in tests/common. Dev-only: no app links str0m through rinch-rtc.
# `openssl`, not `rust-crypto`: str0m-rust-crypto turns on dimpl's `rcgen`,
# which turns on rcgen's `aws_lc_rs`, and cargo unifies that into the rcgen
# webrtc-rs uses, so the tests would make their certificates with aws-lc
# instead of the ring that rinch-rtc ships, and every workspace build would
# compile aws-lc-sys. openssl-sys is already built for the workspace
# (rinch-webrtc's str0m 0.7).
str0m = { version = "=0.24.1", default-features = false, features = ["openssl"] }

# Browser tests. Run with a chromedriver (or geckodriver):
#     CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner \
#     cargo test -p rinch-rtc --target wasm32-unknown-unknown
# web_in_page needs nothing else. web_live_lite needs the lite_echo example
# running (cargo run -p rinch-rtc --example lite_echo) and its URL in
# RINCH_RTC_TEST_URL at build time; with RINCH_RTC_REQUIRE_LIVE=1 (CI) it
# fails instead of skipping when the URL is missing.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Request", "RequestInit", "RequestMode", "Response", "console", "Document", "Element", "HtmlElement", "HtmlVideoElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "AudioContext", "AnalyserNode", "MediaStreamAudioSourceNode", "MediaStream", "MediaStreamTrack", "MediaStreamTrackState", "AudioNode"] }
# web_media's MediaView test mounts a real rinch-web root.
rinch-web = { workspace = true }
wasm-bindgen = "0.2"
