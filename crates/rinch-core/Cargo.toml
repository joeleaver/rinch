[package]
name = "rinch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core types and traits for the rinch GUI framework"

[features]
default = []
theme = []
# Expose `dom::mock::MockDomDocument`, a headless `DomDocument` test double, to
# downstream crates' tests (e.g. the editor view in `rinch`). Test-only —
# enabled via dev-dependencies, never in a production build.
test-util = []

[dependencies]
thiserror.workspace = true
tracing.workspace = true
# Wall/monotonic clock that works on wasm32-unknown-unknown (JS Date/performance.now).
# On native it re-exports std::time verbatim, so this is zero-cost off the web.
web-time = "1"
