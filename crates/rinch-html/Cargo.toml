[package]
name = "rinch-html"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Showing HTML you did not write in rinch: an allow-list cleaner and the HtmlView component"

[dependencies]
rinch-core.workspace = true
# The allow-list (html5ever underneath) and the style-sheet inliner. Both on
# html5ever 0.40 and css-inline on the cssparser/selectors stylo builds with,
# so they add no second copy of either. css-inline without its defaults: no
# HTTP or file loading of linked sheets, no CLI.
ammonia = "4.2"
# Inline styles parsed as Stylo parses them (the version Stylo builds with).
cssparser = "0.38"
# Parsing a document as a browser does, to cut its nesting (depth.rs): the
# version ammonia and css-inline use.
html5ever = "0.40"
# Link addresses, for the tooltip's warning: parsed as a browser parses
# them, shown in their own letters, and compared by the Public Suffix List.
url = "2"
idna = "1"
psl = "2"
css-inline = { version = "0.23", default-features = false }

[dev-dependencies]
rinch-core = { workspace = true, features = ["test-util"] }
