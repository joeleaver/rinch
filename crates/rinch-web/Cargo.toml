[package]
name = "rinch-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser-native DOM backend for rinch (WASM target): WebDocument, event delegation, and mount"

# See the matching note in crates/rinch/Cargo.toml — `web_sys_unstable_apis` is a
# consumer-set RUSTFLAGS cfg, not a cargo feature, and must be declared to avoid
# `unexpected_cfgs` warnings on every wasm build.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(web_sys_unstable_apis)'] }

[dependencies]
# The backend implements rinch-core's DomDocument trait; the event-delegation
# and mount glue use the rinch facade (render_surface, setup_theme_css) plus
# rinch-core's events/drag/render-scope. No rinch-dom/Taffy/Parley/Vello — the
# browser handles layout, text, CSS, and painting natively.
rinch-core = { workspace = true, features = ["theme"] }
rinch = { workspace = true, default-features = false, features = ["components", "theme"] }
# Pure model types (CursorMotion/Pos/Selection) the editor input glue speaks; the
# wasm-clean model crate, no platform deps.
rinch-editor-core = { workspace = true }
# The renderer-agnostic rich-text editor (RinchDomEditorView/EditorHandle/Editor),
# shared with the desktop editor. It projects onto WebDocument's DomDocument impl, so
# the browser editor is the *same* model-first view — no contentEditable. Default
# features only (collaboration is opt-in and links a CRDT engine; off here).
rinch-editor-view = { workspace = true }

# The desktop editing engine's whole-text rewrite diff (`RewriteDiff`), so the
# caret rule under a controlled-value write is ONE implementation on both
# backends (issue #238) instead of two copies drifting apart. Zero dependencies,
# pure `std` — nothing extra enters the wasm build.
rinch-editable = { workspace = true }


# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
    "HtmlTextAreaElement", "HtmlSelectElement", "HtmlOptionElement", "HtmlHeadElement",
    "Node", "NodeList", "Text", "Comment",
    "CssStyleDeclaration", "DomRect", "DomRectList",
    "Event", "MouseEvent", "KeyboardEvent",
    # Pointer Events unify mouse + touch + pen so the element drag-and-drop
    # delegation activates and tracks on touch devices (not just mouse).
    "PointerEvent",
    # Event constructors, so the browser-driven tests (tests/) can synthesise
    # the pointerdown/click/keydown sequences the delegation gates on (#240).
    "MouseEventInit", "KeyboardEventInit", "PointerEventInit",
    "EventTarget", "FocusOptions", "FocusEvent",
    "Range",
    # `window.getSelection()`, so a copy/cut of ordinary page content mirrors
    # into the clipboard buffers the way `copy_text()` does (issue #150).
    "Selection",
    # Clipboard + IME on the editor's hidden capture textarea: clipboard read/write
    # (paste prefers text/html, falls back to an image file then text/plain) and the
    # composition events that drive the IME preedit overlay.
    "ClipboardEvent", "CompositionEvent",
    # `beforeinput` on that same textarea: the only channel a software keyboard has
    # for plain typing (Android reports `keydown` as `Unidentified` / keyCode 229).
    "InputEvent",
    # Composition-event constructor for the focused-value-write tests (#238).
    "CompositionEventInit",
    "DataTransfer", "DataTransferItem", "DataTransferItemList",
    "Blob", "File", "FileReader",
] }

# Browser-driven tests for `<style>` injection (#155): they need a real
# `document.head`, so they only build for wasm. Run with a matching chromedriver:
#   CHROMEDRIVER=/path/to/chromedriver \
#     cargo test -p rinch-web --target wasm32-unknown-unknown
# The cross-platform clipboard buffers. On the web these are the only channel
# through which content copied *outside* the app can reach `rinch::clipboard`
# (issue #150): a `paste` ClipboardEvent carries text/plain + text/html
# synchronously, and the document listener feeds them in. wasm-only, so a
# host-target check of this crate (which CI runs for the whole workspace) does
# not pull arboard in behind it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rinch-clipboard = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# Awaiting a macrotask in the keyboard-activation tests (#240): the pointer-gesture
# flag clears at the end of the task that consumed the trailing click.
wasm-bindgen-futures = "0.4"

[features]
# Collaborative editing (M9): forwards to the editor view's collab adapter, which
# is the only thing that links a CRDT engine (yrs). Off by default, so a default web
# build links zero CRDT code. Nothing else is required of a wasm app enabling it: yrs
# carries `fastrand/js` itself and builds for wasm32 with no feature shims — see
# `examples/collab-editor-web`.
collaboration = ["rinch-editor-view/collaboration"]
