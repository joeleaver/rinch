[package]
name = "rinch-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web backend for rinch (WASM target)"

[dependencies]
rinch-platform = { workspace = true }
vello = { workspace = true }
peniko = "0.6"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlCanvasElement", "Element",
    "MouseEvent", "KeyboardEvent", "WheelEvent",
    "EventTarget", "AddEventListenerOptions",
    "Performance", "PerformanceTiming",
    "console",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
tracing = { workspace = true }
