[package]
name = "rinch-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser-native DOM backend for rinch (WASM target): WebDocument, event delegation, and mount"

# See the matching note in crates/rinch/Cargo.toml — `web_sys_unstable_apis` is a
# consumer-set RUSTFLAGS cfg, not a cargo feature, and must be declared to avoid
# `unexpected_cfgs` warnings on every wasm build.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(web_sys_unstable_apis)'] }

[dependencies]
# The backend implements rinch-core's DomDocument trait; the event-delegation
# and mount glue use the rinch facade (render_surface, setup_theme_css) plus
# rinch-core's events/drag/render-scope. No rinch-dom/Taffy/Parley/Vello — the
# browser handles layout, text, CSS, and painting natively.
rinch-core = { workspace = true, features = ["theme"] }
rinch = { workspace = true, default-features = false, features = ["components", "theme"] }
# Pure model types (CursorMotion/Pos/Selection) the editor input glue speaks; the
# wasm-clean model crate, no platform deps.
rinch-editor-core = { workspace = true }
# The renderer-agnostic rich-text editor (RinchDomEditorView/EditorHandle/Editor),
# shared with the desktop editor. It projects onto WebDocument's DomDocument impl, so
# the browser editor is the *same* model-first view — no contentEditable. Default
# features only (collaboration is opt-in and links automerge; off here).
rinch-editor-view = { workspace = true }

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
    "HtmlTextAreaElement", "HtmlSelectElement", "HtmlOptionElement", "HtmlHeadElement",
    "Node", "NodeList", "Text", "Comment",
    "CssStyleDeclaration", "DomRect", "DomRectList",
    "Event", "MouseEvent", "KeyboardEvent",
    # Pointer Events unify mouse + touch + pen so the element drag-and-drop
    # delegation activates and tracks on touch devices (not just mouse).
    "PointerEvent",
    "EventTarget", "FocusOptions",
    "Range",
    # Clipboard + IME on the editor's hidden capture textarea: clipboard read/write
    # (paste prefers text/html, falls back to an image file then text/plain) and the
    # composition events that drive the IME preedit overlay.
    "ClipboardEvent", "CompositionEvent",
    "DataTransfer", "DataTransferItem", "DataTransferItemList",
    "Blob", "File", "FileReader",
] }

[features]
# Collaborative editing (M9): forwards to the editor view's collab adapter, which
# is the only thing that links Automerge. Off by default, so a default web build
# links zero automerge. A wasm app enabling this must also supply a randomness
# source for the transitive automerge → uuid → getrandom (the getrandom 0.3
# `wasm_js` backend) — see `examples/collab-editor-web`.
collaboration = ["rinch-editor-view/collaboration"]
