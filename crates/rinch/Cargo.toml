[package]
name = "rinch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A lightweight cross-platform GUI library for Rust"

# `web_sys_unstable_apis` is set by downstream consumers (via RUSTFLAGS) that need
# unstable web-sys APIs such as OPFS's `FileSystemSyncAccessHandle`. It is not a
# cargo feature, so declare it here or `unexpected_cfgs` fires on every wasm build.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(web_sys_unstable_apis)'] }

[dependencies]
# Always available (work on all platforms)
rinch-core.workspace = true
rinch-macros.workspace = true
rinch-platform = { workspace = true }
tracing.workspace = true

# Desktop-only rendering deps (optional, enabled by `desktop` feature)
rinch-dom = { workspace = true, optional = true }
rinch-editable = { workspace = true, optional = true }
parley = { workspace = true, optional = true }
peniko = { version = "0.6", optional = true }
vello = { version = "0.7", optional = true }
serde_json = { version = "1", optional = true }

# Desktop-only windowing/rendering (optional, enabled by `desktop` feature)
bytemuck = { version = "1", features = ["derive"], optional = true }
rinch-renderer = { workspace = true, optional = true }
anyrender = { workspace = true, optional = true }
anyrender_vello = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
muda = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
futures-util = { version = "0.3", optional = true }
tracing-subscriber = { workspace = true, optional = true }
png = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }
keyboard-types = { version = "0.7", optional = true }

# Optional features
rfd = { workspace = true, optional = true }
rinch-clipboard = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }

# Platform-independent optional deps
rinch-theme = { workspace = true, optional = true }
rinch-components = { workspace = true, optional = true }
rinch-debug = { path = "../rinch-debug", optional = true }
# ProseMirror-style editor core. Pulled in by the `desktop` feature; the desktop
# runtime's input/IME/focus glue (in `app`/`shell`) reads its `Selection`/`Pos`/
# command types directly.
rinch-editor-core = { workspace = true, optional = true }
# The renderer-agnostic editor view (RinchDomEditorView, EditorHandle, the Editor
# component, the registry, the caret-blink clock) — shared with the web editor
# (rinch-web). This crate's `editor` module re-exports it and adds the desktop-only
# pieces (Parley block virtualization, AccessKit a11y, the winit caret-blink driver).
# `collaboration` forwards to this crate, which holds the only first-party automerge
# link — so default builds (desktop AND web) link zero automerge.
rinch-editor-view = { workspace = true, optional = true }
rinch-video = { workspace = true, optional = true }
# HTTP client for the network image loader (image-network). Standalone, opt-in:
# nothing else in the facade depends on it, so default builds link no HTTP stack.
rinch-http = { workspace = true, optional = true }
memory-stats = { version = "1.2", optional = true }
# Accessibility (M7b) — `accesskit` core types are platform-neutral; the per-platform
# adapter (`accesskit_unix` etc.) lives in the target tables below. Gated by `a11y`.
accesskit = { version = "0.24", optional = true }
softbuffer = { git = "https://github.com/rust-windowing/softbuffer", rev = "672d180", optional = true }

[dev-dependencies]
# Test-only: the headless DomDocument double, used by the new editor view's tests.
rinch-core = { workspace = true, features = ["test-util"] }
# Test-only: direct tree/text queries against RinchDocument (tests/multi_context.rs).
rinch-dom = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
ksni = { workspace = true, optional = true }
# AT-SPI (D-Bus) accessibility adapter for Linux. Pulls zbus/atspi/async-io; only
# compiled when the `a11y` feature is on. Windows/macOS adapters are a follow-up.
accesskit_unix = { version = "0.22", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
    "ImageData",
    # PointerEvent (derefs to MouseEvent) drives the render-surface canvas input
    # on mouse, touch, and pen alike.
    "MouseEvent", "WheelEvent", "PointerEvent",
    "EventTarget", "AddEventListenerOptions",
    "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "DomRectReadOnly",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"], optional = true }
ndk = { version = "0.9", optional = true }
raw-window-handle = { version = "0.6", optional = true }
log = { version = "0.4", optional = true }
android_logger = { version = "0.14", optional = true }
rinch-android = { workspace = true, optional = true }

[features]
default = ["desktop"]
desktop = [
    "dep:rinch-dom", "dep:rinch-editable", "dep:parley",
    "dep:peniko", "dep:serde_json",
    "dep:winit", "dep:muda",
    "dep:tracing-subscriber",
    "dep:png", "dep:base64", "dep:keyboard-types",
    "dep:bytemuck",
    "dep:softbuffer", "rinch-dom/software-renderer",
    # The desktop shell implements + drives `PlatformRenderer` (over vello::Scene), so it
    # needs rinch-platform's `renderer` module. (A web build leaves this off → no vello.)
    "rinch-platform/renderer",
    # The ProseMirror-style rich-text editor is a first-class desktop feature
    # (its rinch-dom view needs the desktop renderer; the web view reuses the same
    # renderer-agnostic rinch-editor-view crate).
    "dep:rinch-editor-core", "dep:rinch-editor-view",
]
android = [
    "dep:rinch-dom", "dep:rinch-editable", "dep:parley",
    "dep:peniko", "dep:serde_json",
    "dep:tracing-subscriber",
    "dep:png", "dep:base64", "dep:keyboard-types",
    "dep:bytemuck",
    "dep:softbuffer", "rinch-dom/software-renderer",
    "dep:android-activity", "dep:ndk", "dep:raw-window-handle",
    "dep:log", "dep:android_logger",
    "dep:rinch-android",
]
gpu = [
    "desktop",
    "dep:vello", "dep:wgpu",
    "dep:rinch-renderer", "dep:anyrender", "dep:anyrender_vello",
    "dep:tokio", "dep:pollster", "dep:futures-util",
]
android-gpu = [
    "android",
    "dep:vello", "dep:wgpu",
    "dep:pollster",
]
# wasm-safe GPU embed (issue #97): the platform-agnostic Embed API — `RinchApp`
# (layout + Vello scene) + `RinchContext`/`build_scene` + wgpu/vello — WITHOUT the
# desktop windowing stack (no winit / softbuffer / muda / tokio). The consumer owns
# the wgpu Device/Queue/Surface and composites the returned Vello scene over its own
# WebGPU render. Mirrors how `android` builds `app` without winit, minus native deps.
# rinch-dom comes in with default-features off (workspace root), so tiny-skia/swash
# (`software-renderer`) stay out — the embed path is Vello-only.
embed = [
    "dep:rinch-dom", "dep:rinch-editable", "dep:parley",
    "dep:peniko",
    "rinch-platform/renderer",
    "dep:vello", "dep:wgpu",
]
file-dialogs = ["rfd"]
clipboard = ["dep:rinch-clipboard"]
system-tray = ["tray-icon", "gtk", "ksni"]
memory-profile = ["memory-stats"]
theme = ["dep:rinch-theme", "rinch-core/theme"]
components = ["theme", "dep:rinch-components"]
debug = ["dep:rinch-debug"]
video = ["dep:rinch-video"]
image-network = ["dep:rinch-http"]
# Editor accessibility (M7b): derive an accesskit TreeUpdate from EditorState and
# push it through a per-platform adapter. Linux uses accesskit_unix (AT-SPI); other
# desktop platforms fall back to a no-op bridge until their adapters land.
a11y = ["desktop", "rinch-editor-core/a11y", "dep:accesskit", "dep:accesskit_unix"]
# Derive serde on the editor's durable wire shape (DocNode / BlockData).
serde = ["rinch-editor-core/serde"]
# Collaborative editing (M9): the Step↔Automerge adapter, wired into `EditorHandle`
# inside rinch-editor-view. The ONLY thing in the workspace that links automerge —
# opt-in, so it stays out of every default build (desktop AND web). Implies `desktop`
# (the editor wiring is a desktop feature); forwards to the shared view crate, which is
# wasm-compatible, so the web view reuses the SAME adapter (the web app supplies a wasm
# randomness source for automerge→uuid).
collaboration = ["desktop", "rinch-editor-view/collaboration"]

# Probe app for the ignored e2e test tests/debug_event_latency.rs (issue #153).
[[example]]
name = "debug_click_latency"
required-features = ["desktop", "debug"]
