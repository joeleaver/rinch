[package]
name = "rinch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A lightweight cross-platform GUI library for Rust"

# `web_sys_unstable_apis` is set by downstream consumers (via RUSTFLAGS) that need
# unstable web-sys APIs such as OPFS's `FileSystemSyncAccessHandle`. It is not a
# cargo feature, so declare it here or `unexpected_cfgs` fires on every wasm build.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(web_sys_unstable_apis)'] }

[dependencies]
# Always available (work on all platforms)
rinch-core.workspace = true
rinch-macros.workspace = true
rinch-platform = { workspace = true }
tracing.workspace = true
# `init_logging` (#1773) hands `log` records to the same output as `tracing`
# events. Already in every lock: `tracing` depends on it.
log = "0.4"
# The CSS generic-family enum `AppFont` names (#1769). It is the very type
# parley/fontique re-export (`fontique::GenericFamily` is `parlance::GenericFamily`),
# named here directly so `rinch::font` builds without the desktop text stack —
# on wasm32 too. Already in Cargo.lock through parley; no dependencies of its own.
# From parley's fork at parley's rev (the workspace Cargo.toml), or it is a second copy.
parlance = { version = "0.1", git = "https://github.com/joeleaver/parley-fork", rev = "998b5f6987f9d36565c9509f48f34861ad620828", default-features = false }

# Desktop-only rendering deps (optional, enabled by `desktop` feature)
rinch-dom = { workspace = true, optional = true }
rinch-editable = { workspace = true, optional = true }
# The word segmentation text fields and the editor share (#1619).
rinch-words = { workspace = true, optional = true }
parley = { workspace = true, optional = true }
peniko = { version = "0.6", optional = true }
vello = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }

# Desktop-only windowing/rendering (optional, enabled by `desktop` feature)
bytemuck = { version = "1", features = ["derive"], optional = true }
rinch-renderer = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
muda = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
futures-util = { version = "0.3", optional = true }
tracing-subscriber = { workspace = true, optional = true }
png = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }
keyboard-types = { version = "0.7", optional = true }
# A file drag's `file:` URIs to paths (#1962; winit 0.31.0-beta.4 hands over
# URIs, not paths).
url = { version = "2", optional = true }

# Optional features
rinch-clipboard = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }

# Platform-independent optional deps
rinch-theme = { workspace = true, optional = true }
rinch-components = { workspace = true, optional = true }
rinch-html = { workspace = true, optional = true }
rinch-debug = { path = "../rinch-debug", optional = true }
# ProseMirror-style editor core. Pulled in by the `desktop` feature; the desktop
# runtime's input/IME/focus glue (in `app`/`shell`) reads its `Selection`/`Pos`/
# command types directly.
rinch-editor-core = { workspace = true, optional = true }
# The renderer-agnostic editor view (RinchDomEditorView, EditorHandle, the Editor
# component, the registry, the caret-blink clock) — shared with the web editor
# (rinch-web). This crate's `editor` module re-exports it and adds the desktop-only
# pieces (Parley block virtualization, AccessKit a11y, the winit caret-blink driver).
# `collaboration` forwards to this crate, which holds the only first-party CRDT link
# — so default builds (desktop AND web) link zero CRDT code.
rinch-editor-view = { workspace = true, optional = true }
rinch-video = { workspace = true, optional = true }
# Node-and-wire editor canvas (graph feature).
rinch-graph-view = { workspace = true, optional = true }
# HTTP client for the network image loader (image-network). Standalone, opt-in:
# nothing else in the facade depends on it, so default builds link no HTTP stack.
rinch-http = { workspace = true, optional = true }
memory-stats = { version = "1.2", optional = true }
# Accessibility (M7b) — `accesskit` core types are platform-neutral; the per-platform
# adapter (`accesskit_unix` etc.) lives in the target tables below. Gated by `a11y`.
accesskit = { version = "0.24", optional = true }
softbuffer = { git = "https://github.com/rust-windowing/softbuffer", rev = "672d180", optional = true }

[dev-dependencies]
# Test-only: the headless DomDocument double, used by the new editor view's tests.
rinch-core = { workspace = true, features = ["test-util"] }
# Test-only: direct tree/text queries against RinchDocument (tests/multi_context.rs).
rinch-dom = { workspace = true }
# Test-only: `app::component_radius_tests` loads the real theme variables, without
# which every `var(--rinch-radius-*)` in the component CSS is invalid at
# computed-value time and every radius reads 0.
rinch-theme = { workspace = true }
# Test-only: `app::text_context_menu_tests` observes what Cut/Copy put on the
# clipboard and preloads what Paste reads, through the in-memory backend.
rinch-clipboard = { workspace = true, features = ["test-backend"] }
# Test-only: `popup_backdrop_hit_tests` mounts a real `DropdownMenu` under its
# real stylesheet, so the ordering the component depends on is checked against
# the component itself and not against a copy of its CSS. A dev-dependency, not
# the optional `components` feature: the test then runs under `cargo test -p
# rinch` with no flags, which is how it will actually be run.
rinch-components = { workspace = true }
# Test-only: `app::click_link_tests` mounts a real `HtmlView` and clicks a
# link inside the HTML it was given.
rinch-html = { workspace = true }
# Test-only: `app::stepper_state_709_tests` needs a `TablerIcon` to name a
# per-step icon with. The facade deliberately does not depend on this crate — the
# icon enum is not in the prelude — so it is a dev-dependency.
rinch-tabler-icons = { workspace = true }
# Test-only: `app::graph_canvas_wheel_tests` drives the node-graph canvas's wheel
# through the real desktop wheel path, without the optional `graph` feature (so
# the test runs under `cargo test -p rinch` with no flags).
rinch-graph-view = { workspace = true }
# Test-only: `gpu_rounded_corners_2321` reads Chrome's screenshots (grey PNGs
# under `tests/fixtures`). The version the optional `png` dependency already is.
png = "0.17"
# Test-only: `tests/testing_harness.rs` drives the public harness, so this
# crate's own tests turn its `testing` feature on (and nothing else: default
# features off, so the `--no-default-features` CI jobs stay what they are).
rinch = { path = ".", default-features = false, features = ["testing"] }

# Vello's shaders from build-time naga IR (#2468), on native targets only: on
# WebGPU, wgpu would write the module back out as WGSL for the browser to parse.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello = { workspace = true, optional = true, features = ["naga_ir"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `malloc_trim` after a GPU renderer compiles its shaders (#2468,
# `gpu_init.rs`). Already in Cargo.lock.
libc = { version = "0.2", optional = true }
# The OS's text settings (#2286): libfontconfig is opened at run time
# (`text_rasterization::fontconfig`), so nothing links it. Already in Cargo.lock.
libloading = { version = "0.8", optional = true }
# The system font watch (#2537): inotify on the font directories, woken by an
# eventfd, so an idle app makes no wake-ups for it. Already in Cargo.lock with
# both features, through calloop, polling and smithay-client-toolkit.
rustix = { version = "1.1", features = ["fs", "event"], optional = true }
gtk = { version = "0.18", optional = true }
ksni = { workspace = true, optional = true }
# AT-SPI (D-Bus) accessibility adapter for Linux. Pulls zbus/atspi/async-io; only
# compiled when the `a11y` feature is on. Windows/macOS adapters are a follow-up.
accesskit_unix = { version = "0.22", optional = true }
# X11 overlay hints (`WM_HINTS.input`, `_NET_WM_STATE_SKIP_TASKBAR`, #1519) that
# winit has no API for, and global hotkeys' X11 grabs + XInput2 raw key events
# (`global-hotkeys`, #1521). Already in the graph through winit-x11.
# RandR: a monitor's CRTC rectangle, which winit's video mode gives unrotated
# (a portrait monitor reads as landscape, #1884).
x11rb = { version = "0.13", default-features = false, features = ["xfixes", "shape", "xinput", "xkb", "randr"], optional = true }
# zbus for the Wayland GlobalShortcuts portal (`global-hotkeys`, #1521, see
# hotkey/backend/portal.rs) and the freedesktop notification service
# (`notifications`, #1522, see notification/backend/freedesktop.rs), each run
# inside a current-thread tokio runtime on its own thread (right whether zbus
# ends up in async-io or tokio mode). None adds a package to Cargo.lock. (tokio is the crate-wide optional
# dependency, so the feature builds it on every platform; a Linux-only rename
# of it does not survive a build that also has `gpu`: "depends on crate tokio
# multiple times with different names".)
zbus = { version = "5", default-features = false, features = ["async-io"], optional = true }
futures-lite = { version = "2", optional = true }

# Native file and message dialogs. The browser's message dialogs need no crate
# and no feature (`dialogs::web`, #1821), and a browser file picker gives no
# path (#1773).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
rfd = { workspace = true, optional = true }

# The browser: `wasm32-unknown-unknown`, not every `wasm32`. A WASI guest
# (`wasm32-wasip1`) that embeds rinch's components runs inside a host that is
# not a browser, where these crates are stubs that panic when reached.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
    "ImageData",
    # PointerEvent (derefs to MouseEvent) drives the render-surface canvas input
    # on mouse, touch, and pen alike.
    "MouseEvent", "WheelEvent", "PointerEvent",
    "EventTarget", "AddEventListenerOptions",
    "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "DomRectReadOnly",
    # `RenderSurfaceHandle::layout_rect` (#1768): the canvas's client rect.
    "DomRect",
    # `init_logging`'s console output and panic hook (#1773).
    "console",
    # `rinch::window` (#1770): the page's resolution media query.
    "MediaQueryList",
    # `rinch::file` (#1771): the picker's hidden `<input type=file>` and the
    # `FileReader` a picked or dropped file is read with.
    "HtmlElement", "HtmlInputElement", "Node", "Event",
    "Blob", "File", "FileList", "FileReader", "DomException",
    # `rinch::worker` (#1772): a Web Worker running the app's own module.
    "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent",
    "DedicatedWorkerGlobalScope", "BlobPropertyBag", "Url",
] }

# Test-only: the browser tests under `tests/` that need `rinch` alone (no
# `rinch-web`), e.g. `embed_web_runtime_1956.rs` (`--features embed`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Test-only: the live X11 hotkey test types through XTEST (`hotkey::backend::x11`).
x11rb = { version = "0.13", features = ["xinput", "xtest"] }
# Test-only: the live activation-token test (`tests/activation_token_2501/`)
# presses a key on a nested compositor, through wlroots' virtual keyboard
# (`zwp_virtual_keyboard_v1`, protocols-misc) or KWin's fake input
# (`org_kde_kwin_fake_input`, protocols-plasma), and runs a plain toplevel
# that activates itself with a token (xdg-shell and xdg-activation,
# protocols). All four are already in the graph through winit.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging",
    # Global hotkeys: the WH_KEYBOARD_LL hook, RegisterHotKey, the hook
    # thread's message pump.
    "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    # `rinch::window::open_url` (#1770): ShellExecuteW.
    "Win32_UI_Shell",
] }
# Toast notifications (`notifications`, #1522): WinRT `Windows.UI.Notifications`
# and the HKCU AppUserModelId registration. 0.62 is already in Cargo.lock.
windows = { version = "0.62", optional = true, features = [
    "UI_Notifications", "Data_Xml_Dom", "Foundation",
    "Win32_System_WinRT", "Win32_System_Registry", "Win32_Foundation", "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The non-activating panel's `becomesKeyOnlyIfNeeded` / `hidesOnDeactivate`
# (#1519). Already in the graph through winit-appkit.
objc2 = { version = "0.6", optional = true }
# UserNotifications completion handlers (`notifications`, #1522); in Cargo.lock.
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"], optional = true }
ndk = { version = "0.9", optional = true }
raw-window-handle = { version = "0.6", optional = true }
android_logger = { version = "0.14", optional = true }
rinch-android = { workspace = true, optional = true }

[features]
default = ["desktop"]
desktop = [
    "dep:rinch-dom", "dep:rinch-editable", "dep:parley",
    "dep:peniko", "dep:serde_json",
    "dep:winit", "dep:muda",
    "dep:x11rb", "dep:objc2", "dep:libloading", "dep:rustix",
    "dep:tracing-subscriber",
    "dep:png", "dep:base64", "dep:keyboard-types", "dep:url",
    "dep:bytemuck",
    "dep:softbuffer", "rinch-dom/software-renderer",
    # The desktop shell implements + drives `PlatformRenderer` (over vello::Scene), so it
    # needs rinch-platform's `renderer` module. (A web build leaves this off → no vello.)
    "rinch-platform/renderer",
    # The ProseMirror-style rich-text editor is a first-class desktop feature
    # (its rinch-dom view needs the desktop renderer; the web view reuses the same
    # renderer-agnostic rinch-editor-view crate).
    "dep:rinch-editor-core", "dep:rinch-editor-view",
    # Word motion / delete / double-click split a CJK or Thai run by ICU's
    # dictionary (#939). parley already links that data here (its
    # `complex-scripts` feature), so it costs this build nothing.
    "rinch-editor-core/word-dictionary",
    # The same dictionary for the text fields' word motion (#1619).
    "dep:rinch-words", "rinch-editable/word-dictionary",
]
android = [
    "dep:rinch-dom", "dep:rinch-editable", "dep:parley",
    "dep:peniko", "dep:serde_json",
    "dep:tracing-subscriber",
    "dep:png", "dep:base64", "dep:keyboard-types",
    "dep:bytemuck",
    # No softbuffer: the Android shell presents straight into the
    # `ANativeWindow` (`SoftSurface`), and `shell::softbuffer_renderer` is
    # `desktop`-only. raw-window-handle likewise belongs to `android-gpu`,
    # whose `AndroidWindow` is its only user in an Android build.
    "rinch-dom/software-renderer",
    "dep:android-activity", "dep:ndk",
    "dep:android_logger",
    "dep:rinch-android",
    # Text fields split words as the editor does (#1619); parley's
    # `complex-scripts` links the same ICU data, so the dictionary is free here.
    "dep:rinch-words", "rinch-editable/word-dictionary",
    # Paste is not optional on a phone. On Android `rinch-clipboard` is only
    # the JNI bridge to `ClipboardManager` (no arboard), so this costs
    # nothing — and without it `handle_paste` reads an empty string, a
    # hardware Ctrl+V inserts nothing, and the IME's
    # `performContextMenuAction(paste)` returns true having pasted nothing
    # (issue #813).
    "clipboard",
]
gpu = [
    "desktop",
    "dep:vello", "dep:wgpu", "dep:libc",
    "dep:rinch-renderer",
    "dep:tokio", "dep:pollster", "dep:futures-util",
]
android-gpu = [
    "android",
    "dep:vello", "dep:wgpu",
    "dep:pollster",
    # `AndroidWindow` wears `HasWindowHandle`/`HasDisplayHandle` so wgpu can
    # make a surface from the `ANativeWindow`.
    "dep:raw-window-handle",
]
# wasm-safe GPU embed (issue #97): the platform-agnostic Embed API — `RinchApp`
# (layout + Vello scene) + `RinchContext`/`build_scene` + wgpu/vello — WITHOUT the
# desktop windowing stack (no winit / softbuffer / muda / tokio). The consumer owns
# the wgpu Device/Queue/Surface and composites the returned Vello scene over its own
# WebGPU render. Mirrors how `android` builds `app` without winit, minus native deps.
# rinch-dom comes in with default-features off (workspace root), so tiny-skia
# (`software-renderer`) stays out — the embed path is Vello-only; swash comes in
# for the glyph-mask atlas (`glyph-atlas`).
embed = [
    "dep:rinch-dom", "dep:rinch-editable", "dep:rinch-words", "dep:parley",
    "dep:peniko",
    "rinch-platform/renderer",
    "dep:vello", "dep:wgpu", "dep:libc",
    # The split compositor's uniforms (#1866).
    "dep:bytemuck",
    # Text from the glyph-mask atlas (#2286); swash, without the software painter.
    "rinch-dom/glyph-atlas",
]
file-dialogs = ["rfd"]
clipboard = ["dep:rinch-clipboard"]
system-tray = ["tray-icon", "gtk", "ksni"]
memory-profile = ["memory-stats"]
theme = ["dep:rinch-theme", "rinch-core/theme"]
components = ["theme", "dep:rinch-components"]
# `rinch::html`: the allow-list cleaner and `HtmlView`, for showing HTML the
# app did not write (mail, feeds, help pages). Adds ammonia and css-inline.
html = ["dep:rinch-html"]
debug = ["dep:rinch-debug"]
# `rinch::testing`: a headless harness for an app's own tests (#2553). Mounts a
# component into a `RinchApp` with no window and no display, sends it input
# through the dispatch the desktop shell uses, and reads the document back.
# Adds no dependency; it does nothing without `desktop` (so a web build that
# turns it on gets no module, and compiles as before).
testing = []
video = ["dep:rinch-video"]
# Node-and-wire editors: the graph model and canvas (docs/design/node-graph.md).
graph = ["dep:rinch-graph-view"]
image-network = ["dep:rinch-http"]
# Editor accessibility (M7b): derive an accesskit TreeUpdate from EditorState and
# push it through a per-platform adapter. Linux uses accesskit_unix (AT-SPI); other
# desktop platforms fall back to a no-op bridge until their adapters land.
a11y = ["desktop", "rinch-editor-core/a11y", "dep:accesskit", "dep:accesskit_unix"]
# Derive serde on the editor's durable wire shape (DocNode / BlockData).
serde = ["rinch-editor-core/serde"]
# Collaborative editing (M9): the Step↔CRDT adapter (yrs), wired into `EditorHandle`
# inside rinch-editor-view. The ONLY thing in the workspace that links a CRDT engine —
# opt-in, so it stays out of every default build (desktop AND web). Implies `desktop`
# (the editor wiring is a desktop feature); forwards to the shared view crate, which is
# wasm-compatible with no shims, so the web view reuses the SAME adapter.
collaboration = ["desktop", "rinch-editor-view/collaboration"]
# Operating-system notifications (`rinch::notification`, issue #1522): the
# freedesktop D-Bus service on Linux, WinRT toasts on Windows,
# UserNotifications on macOS. Off by default; implies no windowing.
notifications = [
    "dep:zbus", "dep:futures-lite",
    "dep:tokio", "tokio/rt", "tokio/sync",
    "dep:windows",
    "dep:objc2", "dep:block2",
]
# System-wide hotkeys with press/release (`rinch::hotkey`, issue #1521): Windows
# low-level hook + RegisterHotKey, macOS Carbon hot keys + CGEventTap, X11
# grabs + XInput2, the Wayland GlobalShortcuts portal. Off by default.
global-hotkeys = [
    "desktop",
    "dep:zbus", "dep:futures-lite", "dep:x11rb",
    "dep:tokio", "tokio/rt", "tokio/sync", "tokio/time",
]

# Background workers that reply on the UI thread (`rinch::worker`, issue
# #1772): a thread on the desktop, a Web Worker running the app's own wasm
# module on the web. Off by default. On the web it reads the glue's
# `import.meta.url`, so the wasm-bindgen glue must be an ES module
# (`--target web`, trunk's default), and the page's CSP must allow `blob:`
# workers.
worker = []


