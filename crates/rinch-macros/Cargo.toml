[package]
name = "rinch-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural macros for rinch - RSX syntax"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits", "visit"] }

[dev-dependencies]
# Integration tests need the full rinch crate to verify rsx! macro codegen.
# Note: This pulls in desktop dependencies (winit, wgpu, vello). If integration
# tests fail to compile due to windowing/GPU deps in headless environments,
# the parser unit tests in node.rs and element.rs are the primary test suite.
rinch = { path = "../rinch", features = ["components", "theme"] }
# Test-only: the real desktop document, so `rsx_style_prop` can observe the
# actual `set_style` merge a style shorthand performs rather than the mock's
# approximation of it (issue #647).
rinch-dom = { workspace = true }
# Test-only: the headless DomDocument double, so the `for` loop's duplicate-key
# behaviour (issue #185) can be asserted against a real rsx! expansion rather
# than a hand-written mirror of the macro's fallback key.
rinch-core = { workspace = true, features = ["test-util"] }
