[package]
name = "rinch-words"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Word segmentation shared by the Rinch rich-text editor and its desktop text fields: which runs of text a word motion, word delete or double-click steps over. Pure Rust, wasm-clean, depends on no rinch crate."

[dependencies]
# Unicode general categories (marks, format chars, decimal digits, emoji).
regex = "1"
# Word segmentation by ICU's dictionary for CJK and South-East Asian runs
# (#939). The same crate and data parley links under `complex-scripts`, so a
# build that has parley pays nothing for it; a build without parley (the web)
# would pay the dictionaries (parley's `complex-scripts`, which links the same
# data, measured +3.8 MB of stripped binary in #659), which is why it is optional.
icu_segmenter = { version = "2.1.2", optional = true, default-features = false, features = ["compiled_data"] }

[features]
default = []
# Split a CJK / Thai run into words with ICU's dictionary. Without it such a
# run is one word, ended by whitespace, punctuation or a change of script.
dictionary = ["dep:icu_segmenter"]
# Test-only cost counter (`segmented_units`).
cost-counters = []
