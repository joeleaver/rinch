[package]
name = "rinch-components"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI component library for the rinch GUI framework - Mantine-inspired components"

[dependencies]
rinch-core.workspace = true
rinch-theme.workspace = true
rinch-macros.workspace = true
rinch-tabler-icons.workspace = true
# The Select's type-ahead instants, read from `rinch_core::timer::now` (#2842);
# `web_time` so the type is `std::time`'s on native and `performance.now()`'s on
# wasm (a bare `Instant::now` panics there).
web-time = "1"

[dev-dependencies]
# The MockDomDocument the ColorPicker tests render onto — a component's effect
# topology is driveable headlessly, with no rinch-dom.
rinch-core = { workspace = true, features = ["test-util"] }
