[package]
name = "rinch-editor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure, renderer-agnostic core of the Rinch rich-text editor: document model, transforms (steps), schema, state, commands, history. No rinch-dom, winit, web_sys, parley, or CRDT engine — wasm-clean."

[dependencies]
thiserror.workspace = true
# Input rules (M4): markdown-shortcut pattern matching. Pure Rust, wasm-clean.
regex = "1"
# Total, attr-aware serialization (M3). Both optional and wasm-clean.
# NO CRDT engine / rinch-dom / winit ever.
serde = { version = "1", optional = true, features = ["derive"] }
pulldown-cmark = { version = "0.12", optional = true, default-features = false }
# Accessibility tree types (M7b). `accesskit` core is pure (only depends on uuid),
# wasm-clean, and carries NO platform/AT-SPI deps — those live in the desktop
# `rinch` crate. Optional + feature-gated so it only compiles when a11y is wanted.
accesskit = { version = "0.24", optional = true }
# Word segmentation by ICU's dictionary for CJK and South-East Asian runs
# (#939). The same crate and data parley links under `complex-scripts`, so a
# build that has parley pays nothing for it; a build without parley (the web)
# would pay the dictionaries (parley's `complex-scripts`, which links the same
# data, measured +3.8 MB of stripped binary in #659), which is why it is optional.
icu_segmenter = { version = "2.1.2", optional = true, default-features = false, features = ["compiled_data"] }

[features]
default = []
# The durable, schema-derived DocNode wire shape (serialize/doc_json.rs).
serde = ["dep:serde"]
# Markdown I/O via pulldown-cmark (serialize/markdown.rs); benign, wasm-clean.
markdown = ["dep:pulldown-cmark"]
# Accessibility tree derivation (a11y.rs): EditorState -> accesskit::TreeUpdate.
a11y = ["dep:accesskit"]
# Split a CJK / Thai run into words with ICU's dictionary (motion.rs). Without
# it such a run is one word, ended by whitespace, punctuation or a change of
# script. The desktop `rinch` build turns it on.
word-dictionary = ["dep:icu_segmenter"]
# Test-only cost counters (`model::attrs::attr_entries_copied`): off in every
# release build; `rinch-editor-collab`'s dev-dependency turns it on for its
# cost tests.
cost-counters = []

[dev-dependencies]
# Only to cross-check serialize/html_integer.rs, a private copy of its HTML
# integer parser (#1164); the library itself depends on no rinch crate.
rinch-core.workspace = true
pretty_assertions = "1"
serde_json = "1"
