[package]
name = "rinch-editor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure, renderer-agnostic core of the Rinch rich-text editor: document model, transforms (steps), schema, state, commands, history. No rinch-dom, winit, web_sys, parley, or automerge — wasm-clean."

[dependencies]
thiserror.workspace = true
# NOTE (editor-rearchitecture milestones): regex (input rules, M4), serde (DocNode
# wire shape, M3), and pulldown-cmark (markdown I/O, M3) are added by the milestone
# that first needs them. M0 is schema-only. NO automerge / rinch-dom / winit ever.

[features]
default = []

[dev-dependencies]
pretty_assertions = "1"
