[package]
name = "rinch-dom"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Grapheme-cluster boundaries for hit testing (#1684).
rinch-words.workspace = true
rinch-core = { workspace = true }
slab = "0.4"
# Taffy 0.14 from joeleaver/taffy-fork, branch `rinch-patch`: v0.14.0 plus thirty-nine commits (seven for floats, one
# laying a float out in its container's run mode, review of #2313, the last
# keeping the tail of a float that reaches below the others, #2362; the measure
# cache's sixteen entries, an auto-height grid's rows sized to their content,
# #2139, a size-only measure, #2141, a table cell stretched past its
# max-width, #2264, and two for table columns sharing space as a table does,
# #2280, two for a table's excess width, colspan minimum and width floor, #2306,
# three sizing a table's rows as a table does, #2312, a child's
# horizontal margins taken out of its room once, #2361, four for a row flex container
# sized to fit its content taking min(max-content, max(min-content, room)),
# #2370, two for a table's captions and imposed heights, #2350 and #2358, a
# comment on the latter, #2403, and one fitting a table beside floats by its own
# width, #2397, two for compressible pictures' intrinsic contributions, #2426
# and #2424, one rounding a location as an absolute edge, #2437, and one placing
# block-level boxes by `justify-self` / `justify-items`, #1985, two aligning
# an absolute box's static position by them, #2541 (one of them its test),
# one resolving a table's percentage columns against its width less every
# spacing, #2333, and one for a table's outer size in other boxes, #2403 #2395
# #2328, after two for
# aspect-ratio, `77ed3108` and `85244a41` (#1561 #1562 #1570 #1571 #2536); list in
# `docs/internals/dependencies.md` "Taffy Fork"). `TaffyTree::compute_layout_with_block_measure` hands a
# leaf's measure the `BlockContext` it is laid out in, so an IFC root wraps its
# lines around the floats beside it (`float_wrap.rs`), and a box laid out while
# floats are active skips Taffy's layout cache, whose key does not hold where
# they are; `find_content_slot` gives a slot its real height rather than
# infinity; and the floats right before an IFC root's measure leaf are left to
# it to place, at the lines they stand in (`PendingFloat`); a formatting-context
# root that holds floats keeps its bottom padding and border below them; and
# marking a box dirty climbs past a box laid out beside floats;
# `compute_sizes_with_block_measure` asks nodes their size without laying them
# out (a table's column widths, #2141); `stretch_past_max_width` lets a cell
# fill its column past the max-width that caps its contribution (#2264);
# `proportional_column_sizing` shares an auto table's room between its columns
# as a table does (#2280, #2306); `fill_max_content` makes a fixed table with a
# percentage width ask for all its room (#2322); and a block sized from its
# content resolves its children's percentages against that width, and
# measures a leaf beside the floats it places (`BlockContext::is_intrinsic`,
# #2326); and `table_rows` sizes a table's rows as Blink does, a rowspan's
# and a taller table's extra height in proportion to the rows' heights (#2312);
# and a table, replaced element or sizing-keyword box sits beside floats only
# if the width it takes there fits, else moves below them (#2397); and
# `round_layout` rounds a location as an absolute edge, so nested fractional
# insets round once, not per level (#2437); and, on `rinch-patch` `20e46064`
# (fork PR #17, #2392), fork PR #18 (`1a9fe737`, `f1a3c1a1`, `31be5276`, `b76ecd84`): a height a parent hands a
# table holds its captions, and a row grows for its baseline-aligned cells
# (`table_row_baseline`; #2596, #2598).
# A dependency, not a [patch], so an app on rinch gets it with
# nothing to copy. Pinned by rev so a push to the fork's branch never changes
# rinch; moving it is a rinch PR, and a Taffy bump rebases the thirty-nine commits.
#
# Taffy's default features minus the four rinch never reads (#1260), which
# cost instructions in every compute whether read or not:
# - `content_size`: a scrollable-overflow rect per node in flex, block, grid and
#   leaf layout, and eight more roundings per node in `round_layout`. rinch
#   measures scroll ranges itself (`paint::scrollbar::content_extents`).
# - `calc`: Taffy's calc pointer. rinch never hands Taffy one — a mixed
#   `calc()` is resolved by `calc_layout.rs` and written in as a plain length
#   — so it only bought a tag check on every length resolution.
# - `flexbox_balance`, `detailed_layout_info`: `flex-wrap: balance` and the
#   grid's per-track output, neither of which rinch maps into or reads out of
#   Taffy.
# `float_layout` is on: Taffy places floats and clears (`floats.rs`).
# Measured on `rinch-bench`'s 500-row list: about -4% instructions per
# structural edit (append, remove, set_text_content). The dev-dependency below
# must carry the same list, or `cargo test` unifies the defaults back in and
# the suite runs a different Taffy than the build.
taffy = { version = "0.14", git = "https://github.com/joeleaver/taffy-fork", rev = "b76ecd843f8d8aaf0e77655bbcb7e3cd0f10a4d6", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "float_layout"] }
bitflags = "2"
# Monotonic/wall clock usable on wasm32-unknown-unknown (layout perf timers + CSS
# transition/animation clocks). Re-exports std::time on native — zero cost off web.
web-time = "1"
tracing = { workspace = true }
parley = { workspace = true }
# parley 0.12's `Run::normalized_coords` is `&[NormalizedCoord]`, a transparent
# `i16`; the painters take `&[i16]`, cast for free (parley's `bytemuck` feature).
# Already in the lock through Vello and others.
bytemuck = "1"
# The primary font's OS/2 `xAvgCharWidth` and `head` bounds, which size a text
# control (#1177). The version parley itself depends on, so nothing new is built.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Emoji_Presentation and grapheme clusters, to give an emoji-presentation
# cluster the `emoji` generic ahead of a generic's text faces (#1204). The
# versions parley and stylo already build with `compiled_data`, so nothing new
# is built.
icu_properties = { version = "2.1", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.1", default-features = false, features = ["compiled_data"] }
vello = { workspace = true }
peniko = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atomic_refcell = "0.1"
euclid = "0.22"
app_units = "0.7"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
# SVG files as images (#2111): usvg parses one into a tree, resvg rasterises it
# at the size it is drawn at (`svg_image.rs`). 0.49 because its tiny-skia is
# 0.12, the one below and the one winit's sctk-adwaita already builds, and its
# kurbo (0.13), roxmltree (0.21) and base64 are the graph's own: eight small new
# crates, no second copy of anything (`cargo tree -d`). Default features off:
# no `text` (a font database and shaping; SVG text is not drawn), no
# `system-fonts`/`memmap-fonts`, no `raster-images` (an `<image>` inside the
# file draws nothing anyway), no `svgz`.
resvg = { version = "0.49", default-features = false }
# The root's `viewBox`, `preserveAspectRatio` and lengths, read for an SVG
# file's natural size (#2111). The version usvg itself builds.
svgtypes = "0.16"

# CSS engine (Stylo from Firefox/Servo)
stylo = { workspace = true }
stylo_traits = { workspace = true }
stylo_dom = { workspace = true }
stylo_atoms = { workspace = true }
stylo_static_prefs = { workspace = true }
servo_arc = { workspace = true }

# cssparser and selectors at the versions stylo 0.22 builds with (a mismatch
# is a second copy and a type error at every boundary; see dependencies.md).
cssparser = "0.38"
selectors = "0.41"
precomputed-hash = "0.1"
# A fast hasher for the scoped IFC pass's node-id sets: SipHash was ~1.5% of
# a keyed-for reverse (#895). Already in the graph via stylo.
rustc-hash = "2"
web_atoms = "0.3"

tiny-skia = { version = "0.12", optional = true }
swash = { version = "0.2", optional = true }

[features]
default = ["software-renderer"]
software-renderer = ["tiny-skia", "glyph-atlas"]
# The glyph-mask atlas both painters draw text from (#2286): swash masks per
# glyph and sub-pixel bucket. Without it the Vello painter draws every glyph as
# an outline. The embed build turns it on without the software painter.
glyph-atlas = ["swash"]

[dev-dependencies]
# The `#[ignore]`d GPU probes of `background_tiling_embed_tests.rs` (#1158)
# block on wgpu's adapter request. Already in the lock through `rinch`.
pollster = "0.4"
# Integration tests name taffy types (the IFC leaf invariant tests, #466,
# inspect `NodeTree::taffy` directly). The same fork and rev, with the same
# features, as the dependency above (see there).
taffy = { version = "0.14", git = "https://github.com/joeleaver/taffy-fork", rev = "b76ecd843f8d8aaf0e77655bbcb7e3cd0f10a4d6", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "float_layout"] }
