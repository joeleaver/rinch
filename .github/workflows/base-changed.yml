name: Base changed
# THROWAWAY probe for #448 (auto-retarget on base-branch deletion). Never merge to main.
on:
  pull_request:
    branches: [main, t448-base]
    types: [edited]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.action == 'edited' && github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ toJSON(github.event.changes) }}
          SENDER: ${{ github.event.sender.login }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "changes=$CHANGES"
          echo "sender=$SENDER actor=$ACTOR base=${{ github.event.pull_request.base.ref }}"
