name: Visual Regression Tests

# Manual-dispatch only, deliberately — see `crates/rinch-visual-test/README.md`
# ("Why this is not a merge gate yet").
#
# The harness works end to end and its exit code is now honoured, but 4 of 12
# scenarios are red for reasons unrelated to any regression: stale `setup_clicks`
# coordinates that no longer reach the section they name, the window chrome rinch
# paints itself (which has no counterpart in the exported HTML), and a handful of
# properties the exporter still does not emit. Wiring a red suite to
# `pull_request` would train everyone to ignore it. Green the scenarios first,
# then add the `pull_request` trigger.
on:
  workflow_dispatch:

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The first line mirrors the `test` job in ci.yml — ui-zoo-desktop links
      # the same gtk/mpv stack, and the previous short list here was missing all
      # of it. The second line is what this job needs on top: unlike ci.yml it
      # has to actually *run* the app under a display server.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev \
            libpango1.0-dev libgdk-pixbuf2.0-dev libxdo-dev libmpv-dev \
            xvfb x11-utils libxkbcommon-dev libwayland-dev libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd crates/rinch-visual-test/scripts
          npm install
          npx playwright install --with-deps chromium

      # Same cache key shape as ci.yml, so this job does not rebuild the whole
      # workspace from cold on every dispatch.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-visual-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-visual-

      # One invocation: the two packages share almost all their dependencies, so
      # building them separately pays for the resolve and link twice.
      #
      # `debug` is already on via ui-zoo-desktop's `rinch` dependency; passing
      # `--features debug` fails, because ui-zoo-desktop declares no such feature.
      - name: Build test runner and test app
        run: cargo build --release -p rinch-visual-test -p ui-zoo-desktop

      - name: Run visual tests
        run: |
          set -euo pipefail

          # Arm cleanup before anything is backgrounded, so an early failure
          # cannot leak Xvfb or the app. The vars are read at trap time, so the
          # empty-until-assigned window is harmless.
          APP_PID=""
          XVFB_PID=""
          trap 'kill $APP_PID $XVFB_PID 2>/dev/null || true' EXIT

          Xvfb :99 -screen 0 1280x1024x24 &
          XVFB_PID=$!
          export DISPLAY=:99

          # Wait for the X server to accept connections rather than guessing.
          for _ in $(seq 1 30); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || { echo "Xvfb never came up"; exit 1; }

          ./target/release/ui-zoo-desktop &
          APP_PID=$!

          # Wait for the app to publish its debug discovery file; the harness
          # needs it to find the port.
          for _ in $(seq 1 60); do
            ls "$HOME"/.rinch/debug/*.json >/dev/null 2>&1 && break
            sleep 1
          done
          ls "$HOME"/.rinch/debug/*.json >/dev/null 2>&1 \
            || { echo "ui-zoo-desktop never registered a debug port"; exit 1; }

          # The discovery file appears when the debug server binds, which is
          # before the first paint and before async image decodes land. The old
          # `sleep 5` covered that settle; keep a shorter one now that the port
          # itself is no longer being guessed at.
          sleep 3

          # The runner exits non-zero when any scenario fails; that is the
          # job's verdict. The trap above cleans up either way without masking it.
          ./target/release/visual-test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: crates/rinch-visual-test/tests/visual/output/
          retention-days: 30

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-report
          path: crates/rinch-visual-test/tests/visual/output/report.html
          retention-days: 30
