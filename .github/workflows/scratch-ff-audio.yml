# SCRATCH (do not merge): why does rinch-av's audio test hang in CI's Firefox?
name: scratch-ff-audio
on: pull_request
jobs:
  ff:
    if: startsWith(github.head_ref, 'scratch-ff-audio')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sound: [pulse]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-test-runner
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Probe the runner's audio
        run: |
          firefox --version
          which pulseaudio pipewire pactl || true
          pactl info || true
          ls -la /dev/snd || true
          aplay -l || true
      - name: Start a null PulseAudio sink
        if: matrix.sound == 'pulse'
        run: |
          start=$(date +%s)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
          pactl info
          echo "SOUND SETUP $(( $(date +%s) - start )) s"
      - name: Firefox tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          export GECKODRIVER="$GECKOWEBDRIVER/geckodriver"
          cargo test -p rinch-av --features audio,camera --target wasm32-unknown-unknown --no-fail-fast 2>&1 | grep -vE '^\s+at ' || true
          cargo test -p rinch-rtc --features media --target wasm32-unknown-unknown --test web_media 2>&1 | grep -vE '^\s+at ' || true
