name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by `base-changed.yml` when a PR's base branch becomes `main` (#448):
  # a base change fires only `edited`, which is not listed above on purpose.
  workflow_call:
  # A full run (every job, the slow ones included) on any branch, by hand.
  workflow_dispatch:

# Batched merges (docs/internals/ci.md). An ordinary pull request into `main` (a
# *component* PR) runs only the fast jobs: `fmt`, `clippy`, `clippy-wasm`,
# `clippy-android`, `check-android` and `check-macos`. The slow ones (the `test` shards,
# `test-wasm` and `test-gpu`) run on a pull request whose head branch starts with `batch/`, on
# every push to `main`, and on a manual dispatch. The lead merges several
# reviewed component PRs into one `batch/YYYY-MM-DD-N` branch and opens one PR
# for it, so the full suite runs once per batch rather than once per push to
# every PR. The slow jobs are skipped by a JOB-LEVEL `if`, never by a path or
# branch filter on the trigger: a skipped job reports as skipped, while a check
# filtered out of a run never reports at all, and a required check waiting on
# it stays pending for ever.
#
# The test is `github.head_ref`, which is the PR's head branch on a
# `pull_request` event and also inside a call from `base-changed.yml` (a called
# workflow sees its caller's `github` context), so a retargeted batch PR runs
# everything and a retargeted component PR runs the fast jobs.

# One run per pull request: a push supersedes the run of the push before it.
# Never on `main` (or a dispatch): those are grouped by their own run id, so no
# run there is cancelled or replaced. A retarget's call from `base-changed.yml`
# (`action == 'edited'`) has a group of its own, so it does not cancel the PR's
# own run in progress, and the PR's own runs (opened, synchronize, reopened)
# share one. A skipped caller job in `base-changed.yml` (a body edit) never
# starts this workflow, so it cannot cancel anything.
concurrency:
  group: ci-${{ github.event.action == 'edited' && 'retarget-' || '' }}${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # This workspace links wgpu, stylo, vello and parley; a full debug build with
  # symbols overruns a runner's ~14 GB of free disk, which surfaces as a linker
  # "Bus error" or `rustc-LLVM ERROR: IO failure ... No space left on device`
  # rather than as a test failure (it took down the `test` job on #114). Debug
  # info is the bulk of that and is useless in CI, where nothing runs a debugger.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Sweep the layout-tree invariants after every `resolve_layout` in every test
  # (#584). Debug builds only, and every `cargo test` here is one.
  #
  # This flag existed from #476 and **had never run in CI at all** — nothing in
  # this file set it — on top of the two silences #584 records: a violation was
  # an `eprintln!` that failed nothing, and `cargo test` captures stderr for
  # every test that passes, which was all of them. Three ways for the same check
  # to report nothing and mean nothing. It fails now, on
  # `RinchDocument::tree_check_verdict`'s partition, so a violation cannot reach
  # `main` unseen; #513's known block-in-inline detachment is waived by shape
  # (15 lines on `fdc01d5`) and reported rather than failed.
  #
  # Setting it at the workflow level covers every `test (…)` shard's `cargo test
  # --workspace` and its feature-gated runs. Measured on `fdc01d5` with the
  # failing hook: 163 targets, 2604 tests, 0 failures. The `clippy`/`check` jobs
  # run no tests, so it is inert there.
  #
  # `RINCH_TREE_CHECK=warn` is the print-only mode, for driving a real app under
  # the flag. Do not use it here: a warn is exactly what this change exists to
  # stop relying on.
  RINCH_TREE_CHECK: "1"

jobs:
  # `cargo test`, in four shards that together run exactly what one `test` job
  # ran before the batched-merge change (one `cargo test --workspace` step, then
  # the feature-gated step): about 41 minutes in one job on a cold cache, where
  # the four now run side by side.
  #
  # The first three shards each select `--workspace`, and only the TARGETS
  # differ, so cargo resolves features exactly as `cargo test --workspace` does:
  # a test alive only because an unrelated example turns its feature on (see
  # the feature-gated shard's comment) is alive in its shard too. Splitting by
  # PACKAGE (`-p`, `--exclude`) would change that unification and kill such
  # tests silently, so do not.
  #
  #   unit:          lib and bin unit tests, doctests, and the examples built
  #                  (`cargo test` builds every example to check it compiles).
  #                  `--lib` is explicit here, so it also builds `rinch-bench`'s
  #                  `test = false` library as a test (0 tests).
  #   integration-*: the integration-test targets, split by the first letter of
  #                  the target name. `[!a-m]*` is the exact complement of
  #                  `[a-m]*` (cargo matches `--test` with `glob::Pattern`), so
  #                  every target is in exactly one shard whatever it is named.
  #   feature-gated: the explicit feature sets, unchanged.
  #
  # Cache: `Swatinem/rust-cache` keeps the dependency artifacts only (it prunes
  # the workspace crates', which a fresh checkout rebuilds anyway), under ONE
  # key shared by the four shards, written only by the `unit` shard on a push
  # to `main`. Four `actions/cache` entries of a whole `target/` each would
  # quadruple the job's share of the repository's 10 GB cache.
  test:
    name: test (${{ matrix.shard }})
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/')
    runs-on: ubuntu-24.04
    strategy:
      # One shard failing says nothing about the others; let them all finish.
      fail-fast: false
      matrix:
        include:
          - shard: unit
            run: |
              cargo test --workspace --lib --bins
              cargo test --workspace --doc
              cargo build --workspace --examples
          - shard: integration-a-m
            run: cargo test --workspace --test '[a-m]*'
          - shard: integration-n-z
            run: cargo test --workspace --test '[!a-m]*'
          # Feature-gated tests. A test file whose `cfg` is false is not "skipped" —
          # it compiles to an EMPTY binary that still prints `Running tests/x.rs` and
          # then `running 0 tests`. Only the COUNT reveals it; grepping for the
          # `Running` line will report a dead file as alive.
          #
          # `cargo test --workspace` unifies features across members, so a gated test
          # can be alive purely because some unrelated example turns its feature on:
          #   * rinch/tests/multi_context.rs (cfg(any(gpu, embed)) — the #134/#136/#138
          #     pins) and rinch/tests/input_routing.rs (same cfg — the #139 per-document
          #     drag routing pins) run only because examples/game-embed and
          #     examples/gpu-device-config enable `rinch/gpu`.
          #   * event_dispatch.rs::paste_image_tests (cfg(all(test, desktop, clipboard)))
          #     runs only because four examples enable `rinch/clipboard`.
          # And one runs ONLY in this shard, never under `--workspace`:
          #   * app/mod.rs::drag_ghost_dirty_region_tests (cfg(all(test, software_shell)) —
          #     the #173 pin) needs `desktop` WITHOUT `gpu`, and `--workspace` unifies
          #     `rinch/gpu` on. Adding `gpu` to the `-p rinch` line below would kill it.
          # Retarget or drop those examples and the pins go dead silently, so name the
          # combinations here rather than inheriting them by luck.
          #
          # One set was genuinely dead: rinch-editor-core/tests/serialize.rs is
          # cfg(all(serde, markdown)) and NOTHING in the workspace enables `markdown`,
          # so its 13 tests — the round-trip surface this step was added for in #123 —
          # ran nowhere at all. `--features serde` alone was never enough.
          #
          # `--all-features` would cover the whole class, but it does not build: it
          # pulls a transitive `ashpd` 0.11.1 that fails to compile. Hence explicit sets.
          # When adding a feature-gated test, add its combination here.
          #
          # `debug` is listed for the same reason: app/debug_commands.rs is
          # cfg(feature = "debug") and its #401 pins (MCP `scroll()` drives the real
          # wheel path) run under `--workspace` only because examples/ui-zoo-desktop
          # enables `rinch/debug`. It does not pull `gpu`, so the software_shell
          # pins below stay alive.
          #
          # `desktop` is listed on the `-p rinch` line to name that gate explicitly
          # rather than inherit it: menu/mod.rs is cfg(feature = "desktop") and
          # `desktop` is a DEFAULT feature of `rinch`, so its #183 pins do run
          # today — but they would die silently if that default ever flipped.
          # Naming it in the existing set is free (the resolved features are
          # unchanged); a separate `-p rinch --features desktop` line would be a
          # whole extra build of `rinch` and its deps for identical coverage,
          # because that line also picks up `desktop` from the defaults.
          - shard: feature-gated
            run: |
              cargo test -p rinch-editor-core --features serde,markdown
              cargo test -p rinch-editor-view --features collaboration
              # rinch-rtc's `media` feature (#1916) with `media-vp8`: its unit
              # tests (src/tests.rs `media_events`, the codecs' round trips) and
              # the native media tests (tests/media_*.rs: two peers in the
              # process, synthetic sources, no audio device), with VP8. The only
              # line in these shards that builds VP8 (libvpx). Without
              # `media-vp8` they run under `--workspace` in the integration-a-m
              # shard, where ui-zoo and video-call turn `media` on: H.264 alone,
              # and a browser-shaped VP8-first offer answered in H.264.
              cargo test -p rinch-rtc --features media,media-vp8
              cargo test -p rinch --features desktop,embed,theme,clipboard,debug
              # Bare on purpose: `desktop` (the default) WITHOUT `clipboard`. The
              # text context menu's no-clipboard pin (#813,
              # `without_the_clipboard_feature_a_selected_field_greys_cut_and_copy`)
              # is cfg(not(feature = "clipboard")): the line above enables the
              # feature, `--workspace` unifies it on, and the `components,theme`
              # line below compiles no `app` module at all — so without this line
              # it runs nowhere. Filtered to the menu's fixtures, which is all this
              # configuration adds; it is still a second build of `rinch`.
              cargo test -p rinch --lib text_context_menu
              # The menu system without a desktop backend — the configuration
              # `rinch-web` resolves `rinch` to. It is the **decoupling** check, not
              # extra coverage: `menu::app_menu_bar`'s `portable_tests` and
              # `menu::tests` both run in the `--workspace` job above (`desktop` is a
              # default feature and `--workspace` unifies it on), and what this line
              # alone would notice is a `use muda::…` or a `winit::keyboard::KeyCode`
              # creeping above the `#[cfg(feature = "desktop")]` line and taking the
              # whole web menu bar with it. The `cargo check` in the `check` job below
              # is the compile-only half of the same question; this one also runs the
              # tests in that configuration, which is where a *behavioural* regression
              # in the cfg'd-down half would show.
              cargo test -p rinch --no-default-features --features components,theme
              # `rinch::worker` (#1772) on the desktop: off by default, and nothing
              # in the workspace turns it on for a host build.
              cargo test -p rinch --no-default-features --features worker --test worker_1772
              # rinch-dom without the software painter (the `embed` build): its
              # background pattern path (#468, #1158) is cfg'd on that, and
              # `--workspace` unifies `software-renderer` on.
              cargo test -p rinch-dom --no-default-features --test background_tiling_embed_tests
    steps:
      - uses: actions/checkout@v4

      # Reclaim disk before building. The runner image ships several GB of
      # toolchains this workspace never uses, and the build needs the headroom
      # (see the debug-info note in `env` above). Every shard builds the whole
      # dependency graph, so every shard needs it.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install system dependencies
        # Cached .debs, and the Google Chrome apt source dropped first
        # (.github/actions/apt-install explains both, #1792).
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev
            libpango1.0-dev libgdk-pixbuf-2.0-dev libxdo-dev libmpv-dev

      # rinch-rtc's `media` feature (#1916). Every shard builds it: the
      # feature-gated one names it (`cargo test -p rinch-rtc --features
      # media,media-vp8`), and the others build ui-zoo and video-call, which
      # turn `media` on under `--workspace` since the call demos were ported
      # onto rinch-rtc.
      # - nasm: openh264's assembly. Without it openh264 builds C only: no
      #   slower to build (its build script: 30.5 s vs 28.4 s), but encoding
      #   runs 2.8x slower (640x480: 6.75 -> 2.37 ms/frame), and CI should
      #   build what an app's release build does.
      - name: Install rinch-rtc media dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: nasm

      # - libvpx-dev: VP8, rinch-rtc's opt-in `media-vp8` (M2, amended
      #   2026-10-28), which only the feature-gated shard builds; nothing
      #   under `--workspace` turns it on. env-libvpx-sys finds it by
      #   pkg-config and generates its bindings with bindgen, which uses the
      #   image's libclang (as nokhwa's v4l2-sys already does).
      - name: Install libvpx (rinch-rtc media-vp8)
        if: matrix.shard == 'feature-gated'
        uses: ./.github/actions/apt-install
        with:
          packages: libvpx-dev

      - name: Install Rust toolchain
        id: rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo (dependencies)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.event_name == 'push' && matrix.shard == 'unit' }}

      - name: Run tests
        run: ${{ matrix.run }}

  # The `#[ignore]`d GPU pixel tests (#1865 D9), on lavapipe: Mesa's software
  # Vulkan driver, so a runner with no GPU still has a Vulkan adapter. They
  # render real Vello scenes and compositor passes through wgpu and read the
  # pixels back; every other job skips them (`#[ignore]`, "needs a GPU
  # adapter"), so until this job they ran only on a developer's machine.
  #
  # A batch / `main` job like the `test` shards (same job-level `if`).
  #
  # The adapter is pinned, not hoped for. `VK_ICD_FILENAMES` (set by the
  # check step to the ICD file the package installed, `lvp_icd.json` or
  # `lvp_icd.x86_64.json` by Mesa version) makes the Vulkan loader see
  # lavapipe alone, and `WGPU_BACKEND=vulkan` makes wgpu
  # enumerate Vulkan alone — the fixtures build their instance with
  # `InstanceDescriptor::from_env_or_default()` so that they read it. With no
  # lavapipe there is then no adapter at all, and every fixture fails on its
  # `.expect("a GPU adapter")`, instead of wgpu falling back to Mesa's GL
  # (llvmpipe) and testing something else. The first step checks the device
  # before anything is built.
  #
  # The counts are exact. A filtered `cargo test` that matches nothing prints
  # `0 passed` and exits 0, and a fixture whose `cfg` went false compiles to
  # nothing; either would turn this job into a green no-op. So each run states
  # how many tests it passes, and a GPU fixture added or removed changes the
  # number here in the same PR.
  #
  # `a_later_window_presents_with_the_shared_device` (`render_surface`) is
  # `#[ignore]`d for an adapter too but also opens a window, which a runner
  # has no display for; `gpu_` does not match it. `gpu_hover_probe` is a
  # timing printout, not a test.
  #
  # Its own cache key: `-p rinch --features gpu,video` and `-p rinch-dom
  # --no-default-features` resolve features differently from the `test`
  # shards' `--workspace`, so their dependency artifacts would not match.
  test-gpu:
    name: test-gpu (lavapipe)
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install system dependencies
        # The desktop stack's packages, plus lavapipe (mesa-vulkan-drivers)
        # and vulkaninfo (vulkan-tools).
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev
            libpango1.0-dev libgdk-pixbuf-2.0-dev libxdo-dev libmpv-dev
            mesa-vulkan-drivers vulkan-tools

      - name: Check the Vulkan device is lavapipe
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1)
          [ -n "$icd" ] || { echo "::error::no lavapipe ICD in /usr/share/vulkan/icd.d"; exit 1; }
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES=$icd vulkaninfo --summary | tee vulkan-summary.txt
          grep -Eq 'driverName += llvmpipe' vulkan-summary.txt \
            || { echo "::error::the Vulkan loader shows no lavapipe (llvmpipe) device"; exit 1; }

      - name: Install Rust toolchain
        id: rust
        uses: ./.github/actions/rust-toolchain

      - name: Cache cargo (dependencies)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-gpu
          save-if: ${{ github.event_name == 'push' }}

      - name: Run the GPU tests
        run: |
          set -euo pipefail
          # run <expected passed> <cargo test args...>: the run must pass and
          # pass exactly that many tests (summed over its `test result:` lines).
          run() {
            local want=$1; shift
            cargo test "$@" 2>&1 | tee gpu-test.log
            local got
            got=$(sed -nE 's/^test result: .* ([0-9]+) passed;.*/\1/p' gpu-test.log \
                  | awk '{ s += $1 } END { print s + 0 }')
            if [ "$got" -ne "$want" ]; then
              echo "::error::cargo test $* passed $got tests; this job expects $want (update the count in ci.yml if a GPU fixture was added or removed)"
              exit 1
            fi
          }
          # The render-surface, compositor and partial-frame fixtures, and
          # the split oracles (`gpu_split_*`, #1865: 25 compositor, 33 runtime,
          # 2 pages), and #1866's GameViewport base layer (7).
          run 88 -p rinch --features gpu,video --lib -- \
            --ignored gpu_ --skip gpu_hover_probe --test-threads=1
          # #1866's GameViewport on the embed overlay (`render(&mut ctx)`
          # through the split compositor, and the band `ctx.scene()` leaves),
          # and #1976's renderer replaced or taking turns (2).
          run 7 -p rinch --features gpu,video --test embed_game_viewport_base_layer_1866 -- \
            --ignored --test-threads=1
          # #1798's gradients and masks against Chrome's pixels.
          run 1 -p rinch --features gpu,video --test gpu_gradient_mask_1798 -- \
            --ignored --test-threads=1
          # The image-brush background path, which is cfg'd on the software
          # painter being off (the `embed` build).
          run 2 -p rinch-dom --no-default-features --test background_tiling_embed_tests -- \
            --ignored gpu_ --test-threads=1

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # Cached .debs, and the Google Chrome apt source dropped first
        # (.github/actions/apt-install explains both, #1792).
        uses: ./.github/actions/apt-install
        with:
          # libvpx-dev: the rinch-rtc `media-vp8` lines below (VP8, #1916).
          packages: >-
            libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev
            libpango1.0-dev libgdk-pixbuf-2.0-dev libxdo-dev libmpv-dev libvpx-dev

      - name: Install Rust toolchain
        id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ steps.rust.outputs.channel }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-${{ steps.rust.outputs.channel }}-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo clippy --workspace` above unifies `rinch/gpu` on (pulled in by the
      # GPU examples), which turns `software_shell` off workspace-wide — so this
      # is the only configuration in which `software_shell`-gated code is ever
      # linted (#629).
      - name: Run clippy (rinch, crate-scoped)
        run: cargo clippy -p rinch --all-targets -- -D warnings

      # Feature combinations the workspace-wide default build never exercises.
      # desktop + embed carries BOTH painters since #140 (the winit shell drives
      # TinySkia while embed RinchContexts drive Vello) and broke silently before
      # anything checked it. `clippy -D warnings`, not `check` (#372): a
      # combination that leaves an item unused is a warning, and
      # `--no-default-features --features embed` carried four (the IME bridge
      # only the desktop shell reads) that `check` printed and passed.
      #
      # `components,theme` with no defaults is the configuration `rinch-web`
      # resolves `rinch` to: no muda, no winit, no rinch-dom. `rinch::menu` and
      # its DOM menu bar build there — that is what lets a web app mount the same
      # menus as its desktop twin — and nothing else in this file would notice a
      # `use muda::…` creeping back above the `#[cfg(feature = "desktop")]` line.
      # `clippy-wasm` below lints rinch-web itself, but warnings from a
      # *dependency* are not denied there, so a broken `rinch` would surface as a
      # confusing rinch-web failure rather than here.
      # #1088: the three `embed` combinations above ran `--lib` only, so a
      # `#[cfg(test)]` module that assumed a desktop-only item (`crate::shell`,
      # `crate::editor`) went unchecked — `--features embed --all-targets`
      # failed to compile with three E0432/E0433 errors, unnoticed because
      # nothing in CI built the `embed` test target. Cheap to widen (this only
      # builds `rinch`, ~15s each here), so all three now run `--all-targets`.
      - name: Check rinch feature combinations
        run: |
          cargo clippy -p rinch --features embed --all-targets -- -D warnings
          cargo clippy -p rinch --no-default-features --features embed --all-targets -- -D warnings
          cargo clippy -p rinch --features gpu,embed --all-targets -- -D warnings
          cargo clippy -p rinch --no-default-features --features components,theme -- -D warnings
          # rinch-rtc's `media` feature (#1916) is off by default. ui-zoo and
          # video-call turn it on under `--workspace` above; named here so
          # that its lint does not depend on them. The Cisco-binary variant
          # and `media-vp8` (VP8 on libvpx, opt-in; nothing in the workspace
          # turns it on) are linted only here. `media-vp8` goes with either
          # H.264 choice (alone it is a compile_error!), so both pairs.
          cargo clippy -p rinch-rtc --features media --all-targets -- -D warnings
          cargo clippy -p rinch-rtc --features media,media-vp8 --all-targets -- -D warnings
          cargo clippy -p rinch-rtc --features media-cisco-openh264 --all-targets -- -D warnings
          cargo clippy -p rinch-rtc --features media-cisco-openh264,media-vp8 --all-targets -- -D warnings

      # Every optional feature of `rinch` that builds on this host, in one
      # build (#1786). Nothing else in the workspace turns `file-dialogs` on,
      # and `system-tray`, `notifications`, `global-hotkeys`, `image-network`,
      # `memory-profile`, `a11y`, `video`, `serde` and `worker` are linted only if
      # some example happens to enable them, so a break there reached an
      # app first. One combined build rather than one per feature: each line
      # here rebuilds `rinch` and whatever the feature pulls in.
      #
      # Excluded, and why:
      #   * `android`, `android-gpu`: Android-target features, linted for
      #     `aarch64-linux-android` / `x86_64-linux-android` by `check-android`.
      #     On this host their shell is cfg'd out and they only add the
      #     Android crates' host stubs.
      # An explicit list rather than `--all-features` (which, scoped to
      # `-p rinch`, does build on 1.99.0 today; the `feature-gated` shard's
      # ashpd note is about the workspace-wide set) so that leaving a feature
      # out is a decision written here. A new optional feature of `rinch` goes
      # on this line.
      #
      # `gpu` is in the list, so `software_shell` code is not linted here; the
      # crate-scoped run above is the one that lints it.
      - name: Check every optional rinch feature
        run: |
          cargo clippy -p rinch --all-targets --features \
            desktop,gpu,embed,file-dialogs,clipboard,system-tray,memory-profile,theme,components,debug,video,image-network,a11y,serde,collaboration,notifications,global-hotkeys,worker \
            -- -D warnings

  # Lint the wasm target too. `clippy --workspace` above only ever sees the native
  # cfg, so anything behind `cfg(target_arch = "wasm32")` — the whole rinch-web
  # backend, the render-surface canvas path, the wasm halves of rinch-ws/http —
  # was never linted. Two real lints and a batch of `unexpected_cfgs` warnings hid
  # there; a green clippy meant less than it looked.
  #
  # Per-crate, not `--workspace`: the workspace still contains crates that only make
  # sense natively (rinch-dom, the shell, the debug server), so the crates that are
  # meant to stand alone on wasm are listed explicitly. rinch-editor-collab is one of
  # them since #190 — under automerge it could not be listed here at all, because
  # automerge -> uuid -> getrandom refused to build for wasm32 unless a *consuming app*
  # turned on a randomness feature. yrs needs no such shim.
  clippy-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            examples/menu-bar-web/target
          key: ${{ runner.os }}-cargo-clippy-wasm-${{ steps.rust.outputs.channel }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-wasm-${{ steps.rust.outputs.channel }}-

      - name: Run clippy (wasm32)
        run: |
          for crate in rinch-core rinch-words rinch-editor-core rinch-editor-collab \
                       rinch-editor-view rinch-http rinch-ws rinch-rtc rinch-web; do
            echo "::group::clippy $crate (wasm32)"
            cargo clippy -p "$crate" --target wasm32-unknown-unknown \
              --all-targets -- -D warnings
            echo "::endgroup::"
          done
          # `rinch` itself in the configurations a wasm app builds it in:
          # `rinch-web`'s (components, theme) is covered through rinch-web
          # above, but `embed` on wasm32 is reached by no crate in the
          # workspace and broke unnoticed (an OS file-drop path calling a
          # native-only `LocalFile::from_path`).
          # rinch-av's web capture, with the features that compile it.
          echo "::group::clippy rinch-av audio,camera (wasm32)"
          cargo clippy -p rinch-av --features audio,camera --target wasm32-unknown-unknown \
            --all-targets -- -D warnings
          echo "::endgroup::"
          echo "::group::clippy rinch embed (wasm32)"
          cargo clippy -p rinch --no-default-features --features components,theme,embed \
            --target wasm32-unknown-unknown -- -D warnings
          echo "::endgroup::"
          # rinch-rtc's `media` feature (#1916), off by default.
          echo "::group::clippy rinch-rtc media (wasm32)"
          cargo clippy -p rinch-rtc --features media --target wasm32-unknown-unknown \
            --all-targets -- -D warnings
          echo "::endgroup::"

      # The web examples are excluded from the workspace (they pin their own
      # `Cargo.lock` and must build for wasm32 alone), so nothing above reaches
      # them and they can rot silently. `menu-bar-web` is built here because it
      # is the only thing in the repo that calls `mount_with_menu_bar` and names
      # `rinch_web::{Menu, MenuItem}` — the web menu bar's whole public surface
      # has no other consumer, in CI or out of it. `--manifest-path` rather than
      # `cd`, so it is one step; its own target dir is cached alongside the
      # workspace's. The other excluded `*-web` examples are still unbuilt here,
      # deliberately: `ui-zoo-web` is covered by the docs workflow, and the rest
      # exercise APIs the workspace crates already test.
      - name: Check the web menu-bar example (wasm32)
        run: |
          cargo check --manifest-path examples/menu-bar-web/Cargo.toml \
            --target wasm32-unknown-unknown

  # Lint the Android target too (#598). `clippy --workspace` above only ever
  # sees the native host cfg — this was the first gate that ever ran clippy
  # against `cfg(target_os = "android")` code at all, and it was red the whole
  # time: `rinch-core` alone carried up to 22 `missing_const_for_thread_local`
  # errors depending on target/feature scope, and `rinch-android` carried a
  # handful more (below).
  #
  # Root cause of the `rinch-core` errors (see `#![cfg_attr(...)]` at the top
  # of `rinch-core/src/lib.rs` and `rinch-android/src/lib.rs` for the full
  # writeup): Android's target spec has no native ELF thread-local support
  # (`tls-model: emulated`, not `has-thread-local`), so `std::sys::thread_local`
  # routes every `thread_local!` through the OS-key `os` module instead of the
  # host's `native` module — the only one of the two with a real
  # `EagerStorage`/`LazyStorage` split keyed on whether the user wrote
  # `const { .. }`. On `os` that distinction is erased before clippy's lint
  # ever sees it, so the lint fires unconditionally: on statics that are
  # already `const` (confirmed via raw compiler JSON), and even on ones that
  # cannot compile as const at all (a `HashMap::new()` initializer, whose
  # `RandomState` is not const-evaluable — the suggested fix produces E0015 if
  # actually applied). It carries zero signal on this target, by construction,
  # so both crates suppress it there specifically and leave it enabled
  # everywhere else clippy runs, including each crate's own host and wasm32
  # gates.
  #
  # `rinch-android` also had `forget_non_drop` (`bridge.rs` — a genuine no-op
  # today since `jni::JavaVM` 0.21.1 has no `Drop` impl, kept and explained at
  # the site rather than removed, as insurance against a future `jni` upgrade)
  # and four `collapsible_if`s (`camera.rs`, `display.rs`) — both fixed
  # outright, not suppressed.
  #
  # Scoped to `rinch-core` (`--all-targets --all-features`, the crate's full
  # surface) and `rinch-android` (`--all-targets`, no `--all-features`: the
  # crate has none): `muda` (native menus) fails to even compile for
  # `aarch64-linux-android` (`unresolved import self::platform`), which takes
  # the whole workspace graph down under cargo's feature unification, so this
  # cannot be `--workspace`.
  #
  # `rinch-android --all-targets` used to hit a further, pre-existing compile
  # break in its *test* code (`location.rs`, `sensors.rs`): a host-only mock
  # module (`disarm_log`, itself correctly gated `cfg(not(target_os =
  # "android"))`) was called from `#[test]` fns gated only `cfg(test)`, so
  # those tests didn't exist on this target's test binary but still referenced
  # a module that didn't — E0433, not a lint. Fixed by #604: those five tests
  # assert only against the host mock's own recording, which has no on-device
  # equivalent, so they're now gated `cfg(not(target_os = "android"))` too,
  # matching `disarm_log` itself — and this job runs `--all-targets` for real.
  clippy-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-android-${{ steps.rust.outputs.channel }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-android-${{ steps.rust.outputs.channel }}-

      # clippy does not link, so no NDK / cargo-ndk linker setup is needed here
      # (unlike `cargo test --target aarch64-linux-android`, which does).
      - name: Run clippy (aarch64-linux-android)
        run: |
          echo "::group::clippy rinch-core (aarch64-linux-android)"
          cargo clippy -p rinch-core --target aarch64-linux-android \
            --all-targets --all-features -- -D warnings
          echo "::endgroup::"

          echo "::group::clippy rinch-android (aarch64-linux-android)"
          cargo clippy -p rinch-android --target aarch64-linux-android \
            --all-targets -- -D warnings
          echo "::endgroup::"

  # Run the browser-backed wasm tests. `IdbStore` talks to a real IndexedDB, so it
  # cannot be exercised by a native `cargo test` — it needs an actual browser.
  # Shipping it unverified is how the crate arrived: the first run of these tests
  # found IndexedDB accepting an empty key that the filesystem backend rejects.
  test-wasm:
    # Slow: batches, `main` and dispatches only (see the note under `on:`).
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/')
    runs-on: ubuntu-24.04
    env:
      # Per test binary, the whole run's budget (seconds). wasm-bindgen-test-runner
      # 0.2.129 (wgpu 30 needs >= 0.2.127, #1955) spends it across every
      # WebDriver poll of the page, and a poll waits for the page's main thread:
      # a binary that keeps the thread busy longer than the budget is killed
      # mid-run. 0.2.126 waited on a blocked poll without limit. The default 20 s
      # is under what review_1449_caret_point takes in Firefox (40 s on main's
      # CI, a grid of synchronous caret-from-point calls; killed at 20 s in batch
      # 35), and review2_1592 and web_media take 19-20 s. Steps that set their own
      # (rinch-rtc's 180) keep theirs.
      WASM_BINDGEN_TEST_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-test-runner
        run: |
          # Must match the wasm-bindgen version in Cargo.lock, or the runner
          # refuses the generated module.
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Install chromedriver matching the runner's Chrome
        run: |
          chrome_version=$(google-chrome --version | grep -oE '[0-9.]+')
          echo "Chrome $chrome_version"
          npx --yes @puppeteer/browsers install "chromedriver@$chrome_version"
          echo "CHROMEDRIVER=$(find "$PWD/chromedriver" -name chromedriver -type f | head -1)" >> "$GITHUB_ENV"

      # media_echo (rinch-rtc's native media peer, #1916) links rinch-av's
      # cpal (ALSA), openh264 (nasm: its assembly) and, built with
      # `media-vp8`, libvpx (VP8).
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: libasound2-dev libvpx-dev nasm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-wasm-${{ steps.rust.outputs.channel }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-wasm-${{ steps.rust.outputs.channel }}-

      - name: Run wasm tests (headless Chrome)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test -p rinch-storage --target wasm32-unknown-unknown
          cargo test -p rinch-ws --target wasm32-unknown-unknown
          cargo test -p rinch-web --target wasm32-unknown-unknown
          # rinch-av's web capture against synthetic sources (an oscillator,
          # a canvas stream; no device). Its crates/rinch-av/webdriver.json
          # lets Chrome run audio without a user gesture.
          cargo test -p rinch-av --features audio,camera --target wasm32-unknown-unknown
          # rinch-rtc against the interop target (design record
          # docs/design/webrtc-data-channels.md, section 4): a str0m ICE-lite
          # echo peer behind `lite_echo`'s HTTP signalling. Its URL is baked in
          # at build time, and RINCH_RTC_REQUIRE_LIVE makes the live test FAIL
          # rather than skip if it is missing: a skip must not read as a pass.
          # The URL is fixed (port 47811), so the Firefox step below builds
          # the same test binaries and rebuilds nothing.
          cargo build -p rinch-rtc --example lite_echo
          target/debug/examples/lite_echo --port 47811 --url-file lite_echo.url &
          for i in $(seq 1 50); do [ -s lite_echo.url ] && break; sleep 0.2; done
          test "$(cat lite_echo.url)" = http://127.0.0.1:47811
          RINCH_RTC_TEST_URL=http://127.0.0.1:47811 RINCH_RTC_REQUIRE_LIVE=1 \
            cargo test -p rinch-rtc --target wasm32-unknown-unknown
          # rinch-rtc's audio and video (#1916), behind its `media` feature:
          # two peers in the page, synthetic sources only (no getUserMedia).
          # The crate's webdriver.json lets audio play without a gesture.
          # The runner's timeout covers the whole binary (20 s by default),
          # and these 15 tests take about 25 s in Firefox: in batch 30 the
          # runner killed a suite that was still passing (each test alone:
          # 0.03-15 s; every wait inside a test is bounded and fails with
          # its name).
          WASM_BINDGEN_TEST_TIMEOUT=180 cargo test -p rinch-rtc --target wasm32-unknown-unknown \
            --features media --test web_media
          # Browser <-> native media (#1916, design record section 6): the
          # browser sends a box to media_echo, a native rinch-rtc peer that
          # decodes it and sends it back re-encoded. Two echoes, two builds:
          # `media,media-vp8` on 47812 (a browser offers VP8 first: VP8
          # through libvpx; Firefox without OpenH264 needs it), and plain
          # `media` on 47813, an app's default build: H.264 alone, through
          # openh264, which a browser's VP8-first offer must still reach. The
          # `media` build is kept as media_echo_h264. The URLs are fixed so
          # the Firefox step reuses these binaries.
          cargo build -p rinch-rtc --features media --example media_echo
          cp target/debug/examples/media_echo target/debug/examples/media_echo_h264
          cargo build -p rinch-rtc --features media,media-vp8 --example media_echo
          target/debug/examples/media_echo --port 47812 --url-file media_echo.url &
          target/debug/examples/media_echo_h264 --port 47813 --url-file media_echo_h264.url &
          for i in $(seq 1 100); do [ -s media_echo.url ] && [ -s media_echo_h264.url ] && break; sleep 0.2; done
          test "$(cat media_echo.url)" = http://127.0.0.1:47812
          test "$(cat media_echo_h264.url)" = http://127.0.0.1:47813
          RINCH_RTC_MEDIA_URL=http://127.0.0.1:47812 RINCH_RTC_MEDIA_H264_URL=http://127.0.0.1:47813 \
            RINCH_RTC_REQUIRE_LIVE=1 WASM_BINDGEN_TEST_TIMEOUT=180 cargo test -p rinch-rtc \
            --target wasm32-unknown-unknown --features media --test web_media_native
          # The editor's read-only collaboration fixture is
          # `#[cfg(feature = "collaboration")]`, which the bare run above does not
          # turn on — it would have run nowhere, and a test that never runs reads
          # exactly like a passing one. Only that target, so the rest of the suite
          # is not compiled and re-run a second time for one fixture.
          cargo test -p rinch-web --target wasm32-unknown-unknown \
            --features collaboration --test editor_read_only
          # Likewise the opt-in ICU word dictionary (#939): the bare run above
          # runs this file's no-dictionary half, this its dictionary half, and is
          # the one place CI compiles rinch-web with `word-dictionary` on.
          cargo test -p rinch-web --target wasm32-unknown-unknown \
            --features word-dictionary --test editor_word_dictionary
          # `rinch` alone with `embed` (#1956): a RinchContext installs the
          # browser's timers and task scheduler. rinch-web's run above builds
          # `rinch` without `embed`, so this file would run nowhere else.
          cargo test -p rinch --no-default-features --features embed \
            --target wasm32-unknown-unknown --test embed_web_runtime_1956

      # rinch-av's audio capture where the browser holds an AudioContext
      # until a user gesture (Chrome's default; the step above allows
      # autoplay). The capture must say `WaitingForGesture`, not deliver
      # silence with no error (#1928's review). Built with
      # RINCH_AV_NO_AUTOPLAY=1, the test asserts that state, so a run
      # under the permissive webdriver.json fails rather than passes.
      - name: Run rinch-av capture without autoplay (headless Chrome)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        working-directory: crates/rinch-av
        run: |
          set -o pipefail
          cp webdriver.json webdriver.json.keep
          echo '{"goog:chromeOptions":{"args":["--headless=new"]}}' > webdriver.json
          RINCH_AV_NO_AUTOPLAY=1 cargo test -p rinch-av --features audio,camera \
            --target wasm32-unknown-unknown --test web_capture_lifetimes \
            -- audio_status 2>&1 | tee noautoplay.log
          mv webdriver.json.keep webdriver.json
          # Positive control: the one test ran.
          grep -q 'test result: ok. 1 passed' noautoplay.log

      # `editor_node_view_real_tab` is `#[ignore]`d above (a synthetic keydown moves
      # no focus): this step builds it with RINCH_REAL_KEYS=1 and runs it with
      # trusted keys sent over the DevTools protocol by `real_keys.mjs`, which needs
      # node >= 22 for its global `WebSocket`. Chrome only: Firefox has no CDP
      # `Input.dispatchKeyEvent` here. The real Tab is the only evidence that focus
      # actually leaves a node view (review 2 of #1595). The same script runs
      # `real_touch_1582_1588` with trusted touches (`Input.dispatchTouchEvent`):
      # a real pan and the compatibility mouse events after a real tap. And
      # `clipboard_copy_then` with a trusted click: a clipboard write the browser
      # accepts needs a user activation (#1780).
      - name: Set up Node (trusted-key test)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the trusted-key test (headless Chrome)
        run: bash crates/rinch-web/tests/support/run_real_keys.sh

      # rinch-rtc's app-fed audio source where the browser holds an
      # AudioContext until a user gesture (Chrome's default; the steps above
      # allow autoplay). The track must say `WaitingForGesture`, not read
      # `live` while sending silence (#1933's review). Built with
      # RINCH_RTC_NO_AUTOPLAY=1 the test asserts that state, so a run under
      # the permissive webdriver.json fails rather than passes.
      - name: Run rinch-rtc audio source without autoplay (headless Chrome)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        working-directory: crates/rinch-rtc
        run: |
          set -o pipefail
          cp webdriver.json webdriver.json.keep
          echo '{"goog:chromeOptions":{"args":["--headless=new"]}}' > webdriver.json
          RINCH_RTC_NO_AUTOPLAY=1 cargo test -p rinch-rtc --features media \
            --target wasm32-unknown-unknown --test web_media \
            -- audio_source_status 2>&1 | tee noautoplay.log
          mv webdriver.json.keep webdriver.json
          # Positive control: the one test ran.
          grep -q 'test result: ok. 1 passed' noautoplay.log

      # The drag auto-scroll fixtures again at a fractional devicePixelRatio
      # (#1592): at DPR 1 a scroll offset is always whole, so the loop's
      # end-of-list test was right there and spun for ever at 1.5. The runner
      # reads `webdriver.json` from the crate directory cargo runs it in.
      - name: Run drag auto-scroll tests (headless Chrome, DPR 1.5)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        working-directory: crates/rinch-web
        run: |
          # `run:` is `bash -e` without pipefail, so without this a failing
          # test would be hidden by `tee`.
          set -o pipefail
          echo '{"goog:chromeOptions":{"args":["--headless=new","--window-size=1024,768","--force-device-scale-factor=1.5"]}}' > webdriver.json
          cargo test -p rinch-web --target wasm32-unknown-unknown \
            --test drag_auto_scroll --test review2_1592 -- --nocapture 2>&1 | tee dpr.log
          rm webdriver.json
          # Positive control: the browser really ran at 1.5 (review2_1592 logs it).
          grep -q '^dpr 1.5 ' dpr.log

      # Firefox opens an AudioContext only with a working audio output, and
      # the runner has no sound server: without one every AudioContext stays
      # `suspended` for ever (measured on ubuntu-24.04, Firefox 157). The
      # rinch-av capture tests then fail (they used to hang until the
      # runner killed them). Headless Chrome plays into its own null sink
      # and needs none of this. A null PulseAudio sink costs about 16 s.
      - name: Start a null audio sink (for Firefox's AudioContext)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
          pactl info | grep -E 'Server String|Default Sink'

      # The same test binaries, a second engine. The suite was written against
      # Chrome alone, and the first Firefox run found a real bug (the caret on
      # the last line of a code block drawn a line too high: Firefox answers a
      # collapsed range after a newline differently) beside two dozen tests that
      # asserted Chrome's own answers. Nothing is rebuilt: only the runner's
      # browser changes. `GECKODRIVER` outranks the `CHROMEDRIVER` the step
      # above exported (wasm-bindgen-test-runner reads the variables in that
      # order), and the runner image ships Firefox with a matching geckodriver
      # at `$GECKOWEBDRIVER`.
      - name: Run wasm tests (headless Firefox)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          export GECKODRIVER="$GECKOWEBDRIVER/geckodriver"
          firefox --version
          "$GECKODRIVER" --version | head -1
          cargo test -p rinch-storage --target wasm32-unknown-unknown
          cargo test -p rinch-ws --target wasm32-unknown-unknown
          cargo test -p rinch-web --target wasm32-unknown-unknown
          cargo test -p rinch-web --target wasm32-unknown-unknown \
            --features collaboration --test editor_read_only
          cargo test -p rinch --no-default-features --features embed \
            --target wasm32-unknown-unknown --test embed_web_runtime_1956
          cargo test -p rinch-av --features audio,camera --target wasm32-unknown-unknown
          # The Chrome step's lite_echo, or a new one on the same port if that
          # one did not outlive its step: the same URL keeps the test binaries
          # the Chrome step built (no rebuild).
          if ! curl -s -o /dev/null -X OPTIONS http://127.0.0.1:47811/offer; then
            rm -f lite_echo_ff.url
            target/debug/examples/lite_echo --port 47811 --url-file lite_echo_ff.url &
            for i in $(seq 1 50); do [ -s lite_echo_ff.url ] && break; sleep 0.2; done
            test "$(cat lite_echo_ff.url)" = http://127.0.0.1:47811
          fi
          RINCH_RTC_TEST_URL=http://127.0.0.1:47811 RINCH_RTC_REQUIRE_LIVE=1 \
            cargo test -p rinch-rtc --target wasm32-unknown-unknown
          WASM_BINDGEN_TEST_TIMEOUT=180 cargo test -p rinch-rtc --target wasm32-unknown-unknown \
            --features media --test web_media
          # Browser <-> native media in Firefox. The runner's Firefox has no
          # OpenH264 plugin and encodes no H.264 at all, so its video is VP8
          # (M2, 2026-10-27), which is why media_echo on 47812 is built with
          # `media-vp8`; the test logs that it skips the H.264 half (47813)
          # and why. The Chrome step's media_echo peers, or new ones on the
          # same ports.
          for spec in "47812:media_echo" "47813:media_echo_h264"; do
            port=${spec%%:*}; bin=${spec#*:}
            if ! curl -s -o /dev/null -X OPTIONS "http://127.0.0.1:$port/offer"; then
              rm -f "media_echo_ff_$port.url"
              "target/debug/examples/$bin" --port "$port" --url-file "media_echo_ff_$port.url" &
              for i in $(seq 1 100); do [ -s "media_echo_ff_$port.url" ] && break; sleep 0.2; done
            fi
          done
          RINCH_RTC_MEDIA_URL=http://127.0.0.1:47812 RINCH_RTC_MEDIA_H264_URL=http://127.0.0.1:47813 \
            RINCH_RTC_REQUIRE_LIVE=1 WASM_BINDGEN_TEST_TIMEOUT=180 cargo test -p rinch-rtc \
            --target wasm32-unknown-unknown --features media --test web_media_native

  # Type-check and lint the Android target. Nothing else in this pipeline compiles it.
  #
  # Almost every module in `crates/rinch-android` is `#[cfg(target_os =
  # "android")]` — the exceptions are the callback registries (`callback`,
  # `lifecycle`, `location`, `sensors`, `scoped`), which are host-compiled and
  # host-tested on purpose — and `shell/android_runtime.rs` is
  # `#[cfg(all(feature = "android", target_os = "android"))]`. So on the Linux
  # runner the JNI half of the crate, and the whole Android shell, compile to
  # nothing at all. `test`, `clippy` and `build` above have all been green while
  # Android code did not compile, and the only thing that has ever caught it is
  # someone running `examples/hello-android/build-apk.sh` on a machine with the
  # NDK.
  #
  # `cargo clippy` needs no NDK: it type-checks without linking, so this job is a
  # toolchain target and nothing more.
  #
  # `--no-default-features` is required. The `android` feature does not turn the
  # desktop defaults off, so a bare `--features android` drags in `muda` (GTK
  # menus) and fails to build for Android — a trap worth not re-discovering.
  #
  # Warnings are denied (#372): an orphaned `use` or a helper only one platform
  # calls is a *warning*, not an error, and the Android defect that motivated
  # this job (a `use std::sync::Mutex;` left behind by PR #370) was exactly
  # that. So this is `clippy -D warnings`, not `check`.
  # `missing_const_for_thread_local` is suppressed on this target only, at the top of each crate that trips it,
  # because it cannot see `const { .. }` there (see `rinch-core/src/lib.rs`).
  #
  # Library targets only: `--all-targets` does not compile rinch's lib-test for
  # Android yet (#793).
  check-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ steps.rust.outputs.channel }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-${{ steps.rust.outputs.channel }}-

      - name: Lint the Android shell and platform crate
        run: |
          for target in aarch64-linux-android x86_64-linux-android; do
            echo "::group::$target"
            cargo clippy -p rinch-android --target "$target" -- -D warnings
            cargo clippy -p rinch --target "$target" \
              --no-default-features --features android -- -D warnings
            cargo clippy -p rinch --target "$target" \
              --no-default-features --features android-gpu -- -D warnings
            echo "::endgroup::"
          done

  # Lint the macOS desktop shell from Linux (#1962). Nothing else builds the
  # `cfg(target_os = "macos")` code (the panel, the native menu bar, the tray),
  # so a winit API it calls can go away unseen: winit 0.31.0-beta.3 removed
  # `WindowAttributesMacOS::with_accepts_first_mouse` and only a macOS build
  # would have said so. `cargo clippy` type-checks without linking, so no
  # Apple SDK is needed; the targets are the toolchain's. Warnings are denied,
  # as in `check-android`, for the same reason (a helper only one platform
  # calls). Two feature sets: the full desktop one, and the bare one (no tray),
  # where a tray-only helper goes unused. Runs on every PR, like the lints.
  check-macos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ steps.rust.outputs.channel }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-${{ steps.rust.outputs.channel }}-

      - name: Lint the macOS desktop shell
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            echo "::group::$target"
            cargo clippy -p rinch --target "$target" \
              --features desktop,gpu,components,theme,file-dialogs,clipboard,system-tray \
              -- -D warnings
            cargo clippy -p rinch --target "$target" \
              --features desktop,components,theme -- -D warnings
            echo "::endgroup::"
          done

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
