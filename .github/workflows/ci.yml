name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # This workspace links wgpu, stylo, vello and parley; a full debug build with
  # symbols overruns a runner's ~14 GB of free disk, which surfaces as a linker
  # "Bus error" or `rustc-LLVM ERROR: IO failure ... No space left on device`
  # rather than as a test failure (it took down the `test` job on #114). Debug
  # info is the bulk of that and is useless in CI, where nothing runs a debugger.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reclaim disk before building. The runner image ships several GB of
      # toolchains this workspace never uses, and the build needs the headroom
      # (see the debug-info note in `env` above).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libxdo-dev libmpv-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --workspace

      # Feature-gated tests. A test file whose `cfg` is false is not "skipped" —
      # it compiles to an EMPTY binary that still prints `Running tests/x.rs` and
      # then `running 0 tests`. Only the COUNT reveals it; grepping for the
      # `Running` line will report a dead file as alive.
      #
      # `cargo test --workspace` unifies features across members, so a gated test
      # can be alive purely because some unrelated example turns its feature on:
      #   * rinch/tests/multi_context.rs (cfg(any(gpu, embed)) — the #134/#136/#138
      #     pins) and rinch/tests/input_routing.rs (same cfg — the #139 per-document
      #     drag routing pins) run only because examples/game-embed and
      #     examples/gpu-device-config enable `rinch/gpu`.
      #   * event_dispatch.rs::paste_image_tests (cfg(all(test, desktop, clipboard)))
      #     runs only because four examples enable `rinch/clipboard`.
      # And one runs ONLY in the explicit step below, never in `--workspace`:
      #   * app/mod.rs::drag_ghost_dirty_region_tests (cfg(all(test, software_shell)) —
      #     the #173 pin) needs `desktop` WITHOUT `gpu`, and `--workspace` unifies
      #     `rinch/gpu` on. Adding `gpu` to the `-p rinch` line below would kill it.
      # Retarget or drop those examples and the pins go dead silently, so name the
      # combinations here rather than inheriting them by luck.
      #
      # One set was genuinely dead: rinch-editor-core/tests/serialize.rs is
      # cfg(all(serde, markdown)) and NOTHING in the workspace enables `markdown`,
      # so its 13 tests — the round-trip surface this step was added for in #123 —
      # ran nowhere at all. `--features serde` alone was never enough.
      #
      # `--all-features` would cover the whole class, but it does not build: it
      # pulls a transitive `ashpd` 0.11.1 that fails to compile. Hence explicit sets.
      # When adding a feature-gated test, add its combination here.
      - name: Run feature-gated tests
        run: |
          cargo test -p rinch-editor-core --features serde,markdown
          cargo test -p rinch-editor-view --features collaboration
          cargo test -p rinch --features embed,theme,clipboard

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libxdo-dev libmpv-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Feature combinations the workspace-wide default build never exercises.
      # desktop + embed carries BOTH painters since #140 (the winit shell drives
      # TinySkia while embed RinchContexts drive Vello) and broke silently before
      # anything checked it. Plain `cargo check` — compile-only, cheap.
      - name: Check rinch feature combinations
        run: |
          cargo check -p rinch --features embed
          cargo check -p rinch --no-default-features --features embed
          cargo check -p rinch --features gpu,embed

  # Lint the wasm target too. `clippy --workspace` above only ever sees the native
  # cfg, so anything behind `cfg(target_arch = "wasm32")` — the whole rinch-web
  # backend, the render-surface canvas path, the wasm halves of rinch-ws/http —
  # was never linted. Two real lints and a batch of `unexpected_cfgs` warnings hid
  # there; a green clippy meant less than it looked.
  #
  # Per-crate, not `--workspace`: the workspace still contains crates that only make
  # sense natively (rinch-dom, the shell, the debug server), so the crates that are
  # meant to stand alone on wasm are listed explicitly. rinch-editor-collab is one of
  # them since #190 — under automerge it could not be listed here at all, because
  # automerge -> uuid -> getrandom refused to build for wasm32 unless a *consuming app*
  # turned on a randomness feature. yrs needs no such shim.
  clippy-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-wasm-

      - name: Run clippy (wasm32)
        run: |
          for crate in rinch-core rinch-editor-core rinch-editor-collab \
                       rinch-editor-view rinch-http rinch-ws rinch-web; do
            echo "::group::clippy $crate (wasm32)"
            cargo clippy -p "$crate" --target wasm32-unknown-unknown \
              --all-targets -- -D warnings
            echo "::endgroup::"
          done

  # Run the browser-backed wasm tests. `IdbStore` talks to a real IndexedDB, so it
  # cannot be exercised by a native `cargo test` — it needs an actual browser.
  # Shipping it unverified is how the crate arrived: the first run of these tests
  # found IndexedDB accepting an empty key that the filesystem backend rejects.
  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-test-runner
        run: |
          # Must match the wasm-bindgen version in Cargo.lock, or the runner
          # refuses the generated module.
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          echo "wasm-bindgen $version"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Install chromedriver matching the runner's Chrome
        run: |
          chrome_version=$(google-chrome --version | grep -oE '[0-9.]+')
          echo "Chrome $chrome_version"
          npx --yes @puppeteer/browsers install "chromedriver@$chrome_version"
          echo "CHROMEDRIVER=$(find "$PWD/chromedriver" -name chromedriver -type f | head -1)" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-wasm-

      - name: Run wasm tests (headless Chrome)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test -p rinch-storage --target wasm32-unknown-unknown
          cargo test -p rinch-web --target wasm32-unknown-unknown

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
