name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libasound2-dev libxdo-dev libmpv-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # `--locked` builds these tools from their own published lockfiles. Without it
      # cargo re-resolves their transitive deps to latest-semver-compatible, which is
      # what broke this job: trunk pulled cssparser 0.33 and 0.37 into one graph and
      # lightningcss failed to compile against the mismatched types.
      - name: Install mdbook
        run: cargo install mdbook --locked --no-default-features

      - name: Install trunk
        run: cargo install trunk --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Build API documentation
        run: |
          cargo doc --no-deps --workspace --document-private-items

      - name: Build mdbook
        run: |
          cd docs && mdbook build

      - name: Build UI Zoo (WASM)
        run: |
          cd examples/ui-zoo-web && trunk build --release --public-url /rinch/ui-zoo/

      - name: Combine documentation
        run: |
          # Create output directory
          mkdir -p _site

          # Copy mdbook as the main site
          cp -r docs/book/* _site/

          # Copy API docs under /api
          cp -r target/doc _site/api

          # Create redirect for API docs root
          echo '<meta http-equiv="refresh" content="0; url=rinch/index.html">' > _site/api/index.html

          # Copy UI Zoo WASM build under /ui-zoo
          cp -r examples/ui-zoo-web/dist _site/ui-zoo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
