name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by `base-changed.yml` when a PR's base branch becomes `main` (#448):
  # a base change fires only `edited`, which is not listed above on purpose.
  workflow_call:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent run per ref, not one globally. A single shared "pages" group made
# every docs run cancel every other one regardless of branch — merging to main would
# kill an in-flight PR's build, and PRs opened close together cancelled each other,
# so a green-looking queue was really a queue of cancellations. Keying on the ref
# still supersedes older runs of the *same* branch (the useful behaviour) while
# letting main and each PR build independently. Only `deploy` touches Pages, and it
# runs on main pushes alone, so per-ref groups cannot produce concurrent deploys.
#
# A run in progress is cancelled on a pull request only: a `main` run (the one
# that deploys) is never cancelled mid-way. A `main` run still WAITING behind
# another one is replaced by a newer `main` push, as any concurrency group
# does, and that newer run deploys the newer docs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Batched merges (docs/internals/ci.md). The full `build` (rustdoc for the whole
# workspace, the mdBook, the UI Zoo wasm build, the Pages artifact) runs on a
# pull request whose head branch starts with `batch/` and on a push to `main`.
# An ordinary component PR into `main` skips it and gets `book` instead: the
# mdBook alone, and only when the PR changes `docs/` (or this file). Both are
# job-level `if`s rather than trigger path filters, so a skipped check reports
# as skipped and never sits pending (a path-filtered required check stays
# pending for ever on a PR it filtered out). Rustdoc and the UI Zoo build follow
# every Rust change, so they are batch-only rather than path-gated.
#
# `github.head_ref` is the caller's inside a call from `base-changed.yml`, so a
# retargeted PR is classified the same way as its own runs.

jobs:
  # Which docs paths the component PR changes: the merge commit GitHub builds
  # for the PR (what `actions/checkout` checks out on `pull_request`) against
  # its first parent, the `main` tip it was merged onto, as `perf.yml` reads it.
  changes:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'batch/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      book: ${{ steps.diff.outputs.book }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: List the changed paths
        id: diff
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          # The book is `docs/src` (`docs/book.toml`); it includes nothing from
          # outside `docs/`.
          if printf '%s\n' "$changed" | grep -qE '^docs/|^\.github/workflows/docs\.yml$'; then
            echo "book=true" >> "$GITHUB_OUTPUT"
          else
            echo "book=false" >> "$GITHUB_OUTPUT"
          fi

  # The mdBook alone, for a component PR that changes it: a broken SUMMARY.md
  # or a missing page fails here rather than in the next batch.
  book:
    needs: changes
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # `--locked`: see the same step in `build`.
      - name: Install mdbook
        run: cargo install mdbook --locked --no-default-features

      - name: Build mdbook
        run: |
          cd docs && mdbook build

  build:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # Cached .debs, and the Google Chrome apt source dropped first
        # (.github/actions/apt-install explains both, #1792).
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libgtk-3-dev libglib2.0-dev libatk1.0-dev libcairo2-dev
            libpango1.0-dev libgdk-pixbuf2.0-dev libasound2-dev libxdo-dev
            libmpv-dev

      - name: Install Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      # `--locked` builds these tools from their own published lockfiles. Without it
      # cargo re-resolves their transitive deps to latest-semver-compatible, which is
      # what broke this job: trunk pulled cssparser 0.33 and 0.37 into one graph and
      # lightningcss failed to compile against the mismatched types.
      - name: Install mdbook
        run: cargo install mdbook --locked --no-default-features

      - name: Install trunk
        run: cargo install trunk --locked

      # Dependency artifacts only, never the workspace crates' (#1836). This
      # was an `actions/cache` of the whole `target/`, and cargo decides a
      # workspace crate is fresh by comparing its source mtimes (the checkout
      # time) with its fingerprint's mtimes (the time they were built, kept by
      # tar). When another run built and saved the cache AFTER this job's
      # checkout (a main push finishing while a batch was installing trunk),
      # every restored fingerprint was newer than the sources: cargo printed
      # no `Checking rinch-core`, documented `rinch` against the cached
      # rinch-core metadata from an older main, and failed with E0432 on any
      # item the PR had just added. A re-run, checked out after that save,
      # rebuilt and passed. `Swatinem/rust-cache` prunes the workspace crates'
      # artifacts before saving, so they are always built from this checkout;
      # it is what ci.yml's `test` and perf.yml use. Only a push to `main`
      # writes the entry, as for `test`, so a PR or batch cannot evict it.
      - name: Cache cargo (dependencies)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          save-if: ${{ github.event_name == 'push' }}

      - name: Build API documentation
        run: |
          cargo doc --no-deps --workspace --document-private-items

      - name: Build mdbook
        run: |
          cd docs && mdbook build

      - name: Build UI Zoo (WASM)
        run: |
          cd examples/ui-zoo-web && trunk build --release --public-url /rinch/ui-zoo/

      - name: Combine documentation
        run: |
          # Create output directory
          mkdir -p _site

          # Copy mdbook as the main site
          cp -r docs/book/* _site/

          # Copy API docs under /api
          cp -r target/doc _site/api

          # Create redirect for API docs root
          echo '<meta http-equiv="refresh" content="0; url=rinch/index.html">' > _site/api/index.html

          # Copy UI Zoo WASM build under /ui-zoo
          cp -r examples/ui-zoo-web/dist _site/ui-zoo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
