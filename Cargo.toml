[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/*",
]
exclude = [
    "examples/ui-zoo-web",
    "examples/menu-bar-web",
    "examples/paint-web",
    "examples/events-web",
    "examples/islands-web",
    "examples/editor-web",
    "examples/editor-node-views-web",
    "examples/collab-editor-web",
    "examples/webgpu-surface-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/rinch"

[workspace.dependencies]
# Internal crates
rinch = { path = "crates/rinch", default-features = false }
rinch-core = { path = "crates/rinch-core" }
rinch-http = { path = "crates/rinch-http" }
rinch-ws = { path = "crates/rinch-ws" }
rinch-dsp = { path = "crates/rinch-dsp" }
rinch-rtc = { path = "crates/rinch-rtc" }
rinch-macros = { path = "crates/rinch-macros" }
rinch-renderer = { path = "crates/rinch-renderer" }
rinch-theme = { path = "crates/rinch-theme" }
rinch-components = { path = "crates/rinch-components" }
rinch-html = { path = "crates/rinch-html" }
rinch-tabler-icons = { path = "crates/rinch-tabler-icons" }
rinch-storage = { path = "crates/rinch-storage" }
rinch-dom = { path = "crates/rinch-dom", default-features = false }
rinch-editor-core = { path = "crates/rinch-editor-core" }
rinch-editor-collab = { path = "crates/rinch-editor-collab" }
rinch-editor-view = { path = "crates/rinch-editor-view" }
rinch-graph-core = { path = "crates/rinch-graph-core" }
rinch-graph-view = { path = "crates/rinch-graph-view" }
rinch-debug = { path = "crates/rinch-debug" }
rinch-editable = { path = "crates/rinch-editable" }
rinch-words = { path = "crates/rinch-words" }
rinch-platform = { path = "crates/rinch-platform" }
rinch-visual-test = { path = "crates/rinch-visual-test" }
rinch-web = { path = "crates/rinch-web" }
rinch-video = { path = "crates/rinch-video" }
rinch-av = { path = "crates/rinch-av" }
rinch-screen-capture = { path = "crates/rinch-screen-capture" }
rinch-android = { path = "crates/rinch-android" }

# Rendering
# Vello from joeleaver/vello-fork, pinned to one commit (#1955): vello 0.11.0
# plus one commit to `vello_encoding`'s image atlas, which the fork's `vello`
# takes by path. It fixes two Vello 0.9+ atlas behaviours: a render of a scene
# with no image, gradient or glyph run wiped the persistent atlas (every
# resident image then drew transparent), and an image stayed resident for two
# renders after its last use, so the atlas had to hold three scenes' images and
# large or many images went undrawn. And its bump buffers
# (joeleaver/vello-fork#1, #3, #4): they have floors that follow the target, and a
# frame that overflows them anyway grows them and is reported through
# `Renderer::check_frames` without `render_to_texture` waiting for the GPU, so
# the shell draws it again. It used to be dropped, and a transparent window went
# blank. And its blend stack (joeleaver/vello-fork#5, #2103): a clip's backdrop
# is kept at 16 bits a channel, not 8, so a split surface's above slice,
# rendered over transparent, composites as the window's scene does. And its
# tinted alpha-mask images (joeleaver/vello-fork#6, #2286): an image draw can paint a colour in the
# image's alpha, which is how the glyph-mask atlas draws each glyph, one mask
# for every colour. And its subpixel (LCD) masks (#2286 stage 3): mask mode 2
# composites a per-channel coverage mask over an opaque pixel, grey elsewhere.
# And its bump buffers' first sizes (joeleaver/vello-fork#8, #2466): they follow
# the target and the scene (`BumpSizes::initial`), calibrated on rinch's
# examples, instead of Vello's fixed sizes, which held about 165 MiB of GPU
# memory per renderer whatever it drew.
# And its `naga_ir` feature (joeleaver/vello-fork#9, #2468): the shaders are
# made from naga modules parsed at build time, so `Renderer::new` no longer
# parses their WGSL (119 M of its 149 M instructions on a warm driver cache).
# `crates/rinch/Cargo.toml` turns it on for native targets only: on WebGPU
# wgpu would turn the module back into WGSL for the browser.
# And its bind-group cache (joeleaver/vello-fork#10, #2469): a frame reuses the
# bind groups of the frames before it where they bind the same resources.
# And its bilinear image taps (joeleaver/vello-fork#11, #1661, #1755): the
# extend mode applies to each tap, so an `Extend::Repeat` image blends across
# its seam as tiny-skia and Chrome do, where it read the edge texel alone.
# And its per-frame bump reports (joeleaver/vello-fork#13, `take_bump_reports`,
# for deskrinch's bump calibration; unused by rinch itself yet), merged with #11
# at b800513d.
# A dependency, not a [patch], so an app on rinch gets it with nothing to
# copy; apps use `rinch::vello`. Pinned by rev so a push to the fork's branch
# never changes rinch.
vello = { git = "https://github.com/joeleaver/vello-fork", rev = "b800513d819ab7e7d78f0ac0501893280b6394cc" }
wgpu = "30"

# Windowing and input: winit 0.31.0-beta.4 from joeleaver/winit-fork, branch
# rinch-patch-beta4, pinned to one commit (#1962). The fork is upstream's
# v0.31.0-beta.4 tag plus the wlr-layer-shell window role
# (WindowAttributesWayland::with_layer_shell, #1523; a layer surface's move is
# confirmed by WindowEvent::Moved, #1597), an X11 fix: each raw pointer
# event under a pointer grab came twice (#2114), a layer surface's axis
# anchored to both edges can take the compositor's size (#2413), and monitor
# changes (ApplicationHandler::monitors_changed on Wayland and X11,
# xdg_output's logical rectangle; #2414), and an xdg-activation token request
# that names the seat and serial of the latest input its window received
# (set_serial, #2501), and popups (#2552, joeleaver/winit-fork#5): upstream
# winit#4819 (a popup's surface outlives popup_done; a child holds its parent),
# a popup's grab from the newest press of its parent chain (NoGrabCause when
# none), Moved for a popup's placement, request_popup_reposition. Wayland drag and drop is
# upstream's own since beta.4. A dependency, not a [patch], so an app on rinch needs no
# patch lines (an app that uses winit itself can name this rev, for one winit
# in its build). Pinned by rev so a push to the fork's branch never changes
# rinch. The fork takes crates.io dpi, so the graph has one dpi (muda's too):
# docs/internals/app-and-windows.md "winit Fork".
winit = { git = "https://github.com/joeleaver/winit-fork", rev = "6f69d8c4c8578f4065ef8a5a90554f1d7ccb4b77" }

# Menus
muda = "0.15"

# System tray
tray-icon = "0.19"
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }

# File dialogs
rfd = "0.15"

# Clipboard
arboard = "3"
rinch-clipboard = { path = "crates/rinch-clipboard" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Text layout. parley 0.12.0 from joeleaver/parley-fork, branch `rinch-rtl-inline-boxes` (fork PR #6 into `rinch-patch`),
# pinned to one commit: v0.12.0 plus the commits listed in
# docs/internals/dependencies.md "Parley Fork". A dependency, not a patch; its
# workspace's `parlance` is the one `rinch` names too (crates/rinch/Cargo.toml),
# so the two pins move together.
parley = { version = "0.12.0", git = "https://github.com/joeleaver/parley-fork", rev = "d1826da3581098d86bc2c145bbea5f26036d1009", features = ["complex-scripts", "bytemuck"] }

# CSS engine (Stylo from Firefox/Servo)
stylo = "0.22"
stylo_traits = "0.22"
stylo_dom = "0.22"
stylo_atoms = "0.22"
stylo_static_prefs = "0.22"
servo_arc = "0.5"

# Utilities
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hot reload
notify = "7"

# No [patch.crates-io]: the wgpu fork was removed (#1955; rinch renders to an
# Rgba8Unorm intermediate, whose STORAGE_BINDING WebGPU guarantees), and winit
# is the dependency above (#1962).
