[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/*",
]
exclude = [
    "crates/rinch-visual-test",
    "examples/gen_browser_screenshot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/rinch"

[workspace.dependencies]
# Internal crates
rinch = { path = "crates/rinch" }
rinch-core = { path = "crates/rinch-core" }
rinch-macros = { path = "crates/rinch-macros" }
rinch-renderer = { path = "crates/rinch-renderer" }
rinch-theme = { path = "crates/rinch-theme" }
rinch-widgets = { path = "crates/rinch-widgets" }
rinch-tabler-icons = { path = "crates/rinch-tabler-icons" }
rinch-dom = { path = "crates/rinch-dom" }
rinch-editor = { path = "crates/rinch-editor" }
rinch-editor-macros = { path = "crates/rinch-editor-macros" }
rinch-editor-widgets = { path = "crates/rinch-editor-widgets" }
rinch-debug = { path = "crates/rinch-debug" }
rinch-visual-test = { path = "crates/rinch-visual-test" }

# Rendering
anyrender = "0.7"
anyrender_vello = "0.7"
vello = "0.7"
wgpu = "27"

# Windowing and input
winit = "0.30"
accesskit = "0.16"
accesskit_winit = "0.22"

# Menus
muda = "0.14"

# System tray
tray-icon = "0.19"

# File dialogs
rfd = "0.15"

# Clipboard
arboard = "3"
rinch-clipboard = { path = "crates/rinch-clipboard" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Text layout
parley = { git = "https://github.com/linebender/parley", rev = "f6a8485c35367b581b03bd6da55c8465f24e16ef" }

# CSS engine (Stylo from Firefox/Servo)
stylo = "0.11"
stylo_traits = "0.11"
stylo_dom = "0.11"
stylo_atoms = "0.11"
stylo_config = "0.11"
stylo_taffy = { git = "https://github.com/dioxuslabs/blitz", package = "stylo_taffy" }
servo_arc = "0.4"

# Utilities
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Hot reload
notify = "7"

# Patch wgpu to use our fork with fixes for Rgba8Unorm storage texture validation
# Required for transparent windows with Vello on Windows (DX12 + DirectComposition)
# See: https://github.com/gfx-rs/wgpu/pull/8908 (still open as of Jan 2026)
# Fork rebased to wgpu v27.0.1 for Vello rendering
[patch.crates-io]
wgpu = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
wgpu-core = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
wgpu-hal = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
wgpu-types = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
naga = { git = "https://github.com/joeleaver/wgpu-fork", branch = "rinch-patch" }
