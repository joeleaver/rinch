[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/*",
]
exclude = [
    "examples/ui-zoo-web",
    "examples/menu-bar-web",
    "examples/paint-web",
    "examples/events-web",
    "examples/islands-web",
    "examples/editor-web",
    "examples/editor-node-views-web",
    "examples/collab-editor-web",
    "examples/webgpu-surface-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/rinch"

[workspace.dependencies]
# Internal crates
rinch = { path = "crates/rinch", default-features = false }
rinch-core = { path = "crates/rinch-core" }
rinch-http = { path = "crates/rinch-http" }
rinch-ws = { path = "crates/rinch-ws" }
rinch-rtc = { path = "crates/rinch-rtc" }
rinch-macros = { path = "crates/rinch-macros" }
rinch-renderer = { path = "crates/rinch-renderer" }
rinch-theme = { path = "crates/rinch-theme" }
rinch-components = { path = "crates/rinch-components" }
rinch-tabler-icons = { path = "crates/rinch-tabler-icons" }
rinch-storage = { path = "crates/rinch-storage" }
rinch-dom = { path = "crates/rinch-dom", default-features = false }
rinch-editor-core = { path = "crates/rinch-editor-core" }
rinch-editor-collab = { path = "crates/rinch-editor-collab" }
rinch-editor-view = { path = "crates/rinch-editor-view" }
rinch-debug = { path = "crates/rinch-debug" }
rinch-editable = { path = "crates/rinch-editable" }
rinch-words = { path = "crates/rinch-words" }
rinch-platform = { path = "crates/rinch-platform" }
rinch-visual-test = { path = "crates/rinch-visual-test" }
rinch-web = { path = "crates/rinch-web" }
rinch-video = { path = "crates/rinch-video" }
rinch-av = { path = "crates/rinch-av" }
rinch-webrtc = { path = "crates/rinch-webrtc" }
rinch-signaling = { path = "crates/rinch-signaling" }
rinch-screen-capture = { path = "crates/rinch-screen-capture" }
rinch-android = { path = "crates/rinch-android" }

# Rendering
# Vello from joeleaver/vello-fork, pinned to one commit (#1955): vello 0.11.0
# plus one commit to `vello_encoding`'s image atlas, which the fork's `vello`
# takes by path. It fixes two Vello 0.9+ atlas behaviours: a render of a scene
# with no image, gradient or glyph run wiped the persistent atlas (every
# resident image then drew transparent), and an image stayed resident for two
# renders after its last use, so the atlas had to hold three scenes' images and
# large or many images went undrawn. A dependency, not a [patch], so an app on
# rinch gets it with nothing to copy; apps use `rinch::vello`. Pinned by rev
# so a push to the fork's branch never changes rinch.
vello = { git = "https://github.com/joeleaver/vello-fork", rev = "c6b2e61558962d0074a98f46d55a435c06901865" }
wgpu = "30"

# Windowing and input (using fork with Wayland DnD support)
winit = "0.31.0-beta.2"

# Menus
muda = "0.15"

# System tray
tray-icon = "0.19"
ksni = { version = "0.3", default-features = false, features = ["blocking", "tokio"] }

# File dialogs
rfd = "0.15"

# Clipboard
arboard = "3"
rinch-clipboard = { path = "crates/rinch-clipboard" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Text layout
parley = { version = "0.11.1", features = ["complex-scripts"] }

# CSS engine (Stylo from Firefox/Servo)
stylo = "0.11"
stylo_traits = "0.11"
stylo_dom = "0.11"
stylo_atoms = "0.11"
stylo_config = "0.11"
servo_arc = "0.4"

# Utilities
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hot reload
notify = "7"

# wgpu fork removed (#1955): rinch renders to an Rgba8Unorm intermediate, whose
# STORAGE_BINDING WebGPU guarantees; gfx-rs/wgpu#8908 closed unmerged.
[patch.crates-io]
# Patch winit to use our fork with Wayland DnD support
# Upstream winit 0.31-beta.2 has no Wayland drag-and-drop implementation, and no
# wlr-layer-shell window role (WindowAttributesWayland::with_layer_shell, #1523).
# rinch-patch includes bf5d1870 (#1597): a layer surface's move is confirmed by
# a WindowEvent::Moved after a wl_display.sync.
winit = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-core = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-common = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-wayland = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
winit-x11 = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
dpi = { git = "https://github.com/joeleaver/winit-fork", branch = "rinch-patch" }
