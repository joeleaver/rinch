<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rust patina gradient for the tool body -->
    <linearGradient id="rust-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c1440e"/>
      <stop offset="35%" stop-color="#a33a0c"/>
      <stop offset="65%" stop-color="#8b3209"/>
      <stop offset="100%" stop-color="#6d2706"/>
    </linearGradient>

    <!-- Darker rust for the hammer head -->
    <linearGradient id="rust-hammer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3510"/>
      <stop offset="40%" stop-color="#7a2a0a"/>
      <stop offset="100%" stop-color="#5c1f06"/>
    </linearGradient>

    <!-- Wrench jaw gradient -->
    <linearGradient id="rust-wrench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4500f"/>
      <stop offset="50%" stop-color="#b8420d"/>
      <stop offset="100%" stop-color="#8b3209"/>
    </linearGradient>

    <!-- Subtle highlight for depth -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Pitting/texture filter for rusty look -->
    <filter id="rust-texture" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray-noise"/>
      <feBlend in="SourceGraphic" in2="gray-noise" mode="multiply" result="textured"/>
      <feComposite in="textured" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#1a0a02" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Tool rotated 45 degrees — wrench (top-right) to hammer (bottom-left) -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#shadow)">

    <!-- === HAMMER HEAD (left side) === -->
    <g filter="url(#rust-texture)">
      <!-- Hammer block - chunky and satisfying -->
      <rect x="62" y="218" width="120" height="76" rx="6" fill="url(#rust-hammer)" stroke="#4a1a04" stroke-width="2"/>
      <!-- Hammer face (striking surface) — flat left edge -->
      <rect x="52" y="224" width="18" height="64" rx="3" fill="#6d2706" stroke="#4a1a04" stroke-width="1.5"/>
      <!-- Claw notch on top -->
      <path d="M 82 218 L 82 195 Q 82 185, 92 185 L 108 185 Q 118 185, 118 195 L 118 218"
            fill="none" stroke="#4a1a04" stroke-width="2"/>
      <path d="M 84 218 L 84 196 Q 84 188, 93 188 L 107 188 Q 116 188, 116 196 L 116 218"
            fill="url(#rust-hammer)"/>
      <!-- Hammer highlight -->
      <rect x="68" y="222" width="108" height="30" rx="4" fill="url(#highlight)"/>
    </g>

    <!-- === HANDLE (center shaft) === -->
    <g filter="url(#rust-texture)">
      <!-- Main shaft -->
      <rect x="178" y="236" width="156" height="40" rx="6" fill="url(#rust-body)" stroke="#6d2706" stroke-width="2"/>
      <!-- Grip texture lines -->
      <line x1="210" y1="240" x2="210" y2="272" stroke="#6d2706" stroke-width="1.5" stroke-opacity="0.5"/>
      <line x1="225" y1="240" x2="225" y2="272" stroke="#6d2706" stroke-width="1.5" stroke-opacity="0.5"/>
      <line x1="240" y1="240" x2="240" y2="272" stroke="#6d2706" stroke-width="1.5" stroke-opacity="0.5"/>
      <line x1="255" y1="240" x2="255" y2="272" stroke="#6d2706" stroke-width="1.5" stroke-opacity="0.5"/>
      <line x1="270" y1="240" x2="270" y2="272" stroke="#6d2706" stroke-width="1.5" stroke-opacity="0.5"/>
      <line x1="285" y1="240" x2="285" y2="272" stroke="#6d2706" stroke-width="1.5" stroke-opacity="0.5"/>
      <line x1="300" y1="240" x2="300" y2="272" stroke="#6d2706" stroke-width="1.5" stroke-opacity="0.5"/>
      <line x1="315" y1="240" x2="315" y2="272" stroke="#6d2706" stroke-width="1.5" stroke-opacity="0.5"/>
      <!-- Handle highlight -->
      <rect x="182" y="238" width="148" height="16" rx="4" fill="url(#highlight)"/>
    </g>

    <!-- === WRENCH HEAD (right side) === -->
    <g filter="url(#rust-texture)">
      <!-- Wrench body — tapers from handle to jaw -->
      <path d="M 330 236 L 380 226 L 380 286 L 330 276 Z"
            fill="url(#rust-wrench)" stroke="#6d2706" stroke-width="2"/>

      <!-- Upper jaw -->
      <path d="M 378 226 L 450 210 Q 460 208, 460 218 L 460 240 L 378 248 Z"
            fill="url(#rust-wrench)" stroke="#6d2706" stroke-width="2"/>

      <!-- Lower jaw -->
      <path d="M 378 264 L 460 272 Q 460 282, 460 294 Q 460 304, 450 302 L 378 286 Z"
            fill="url(#rust-wrench)" stroke="#6d2706" stroke-width="2"/>

      <!-- Jaw gap (the business end) -->
      <rect x="380" y="245" width="82" height="22" rx="2" fill="#1a0a02" opacity="0.85"/>

      <!-- Wrench highlight -->
      <path d="M 332 238 L 378 228 L 378 248 L 332 254 Z"
            fill="url(#highlight)"/>
    </g>

    <!-- === RUST SPOTS (scattered patina) === -->
    <circle cx="100" cy="260" r="4" fill="#d4500f" opacity="0.3"/>
    <circle cx="140" cy="240" r="3" fill="#e8700a" opacity="0.25"/>
    <circle cx="200" cy="268" r="5" fill="#d4500f" opacity="0.2"/>
    <circle cx="260" cy="244" r="3.5" fill="#e8700a" opacity="0.25"/>
    <circle cx="350" cy="270" r="4" fill="#d4500f" opacity="0.2"/>
    <circle cx="420" cy="235" r="3" fill="#e8700a" opacity="0.3"/>
    <circle cx="430" cy="285" r="3.5" fill="#d4500f" opacity="0.25"/>
  </g>
</svg>
